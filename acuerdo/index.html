<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acuerdo de servicio · Dakra Studio</title>
<meta name="description" content="Acuerdo de servicio de Dakra Studio para páginas web: qué incluye, precios, pagos, entregas y cambios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F7FB;--paper:#fff;--ink:#121A33;--soft:#56607A;--navy:#101B3B;--cyan:#1FAFAA;--line:#E1E5EF}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Atkinson Hyperlegible",system-ui,sans-serif}
  :focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
  .top{background:var(--navy);color:#fff}
  .top .in{max-width:760px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .logo{font:700 22px "JetBrains Mono",monospace;color:#3DD6D0;text-decoration:none}
  .logo b{color:#fff}
  .lang{background:none;border:1.5px solid #fff;color:#fff;font:700 14px "Atkinson Hyperlegible";padding:6px 14px;border-radius:999px;cursor:pointer}
  main{max-width:760px;margin:0 auto;padding:28px 20px 60px}
  .doc{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
  h1{font-size:clamp(26px,5vw,34px);line-height:1.15;margin:0 0 6px}
  .sub{color:var(--soft);margin:0 0 22px}
  h2{font-size:19px;margin:26px 0 6px;display:flex;gap:10px;align-items:baseline}
  h2 span{font:700 14px "JetBrains Mono",monospace;color:var(--cyan)}
  p,li{max-width:66ch}
  ul{padding-left:20px;margin:6px 0}
  .box{background:#EEF9F8;border-left:4px solid var(--cyan);border-radius:10px;padding:14px 16px;margin-top:24px}
  .note{font-size:14px;color:var(--soft);margin-top:24px}
  footer{max-width:760px;margin:0 auto;padding:0 20px 40px;font-size:14px;color:var(--soft)}
  footer a{color:var(--navy)}
</style>
</head>
<body>
<div class="top"><div class="in"><a class="logo" href="https://dakrastudio.com/">&lt;<b>D</b>/&gt; Dakra Studio</a><button class="lang" data-lang>English</button></div></div>
<main>
  <article class="doc">
    <h1 data-es="Acuerdo de servicio" data-en="Service agreement"></h1>
    <p class="sub" data-es="Páginas web para negocios locales · Tennessee" data-en="Websites for local businesses · Tennessee"></p>

    <h2><span>1</span><b data-es="Qué incluye" data-en="What's included"></b></h2>
    <ul>
      <li data-es="Una página web en español e inglés con la información de tu negocio: menú o servicios, horario, ubicación con mapa, botón para llamar y reseñas." data-en="A website in English and Spanish with your business information: menu or services, hours, location with map, call button and reviews."></li>
      <li data-es="Diseño adaptado a celular y computadora." data-en="Design that works on phones and computers."></li>
      <li data-es="Los extras que elijas (por ejemplo, el asistente de chat o el mantenimiento mensual) se anotan en el mensaje de confirmación con su precio." data-en="Any extras you choose (for example, the chat assistant or monthly maintenance) are listed in the confirmation message with their price."></li>
    </ul>

    <h2><span>2</span><b data-es="Precio y pagos" data-en="Price and payments"></b></h2>
    <ul>
      <li data-es="El precio total es el que acordamos por mensaje antes de empezar. No hay cobros sorpresa." data-en="The total price is the one we agree on by message before starting. No surprise charges."></li>
      <li data-es="50% de anticipo para empezar y 50% cuando la página esté publicada y tú la hayas aprobado." data-en="50% deposit to start and 50% once the website is published and you have approved it."></li>
      <li data-es="Solo dos pagos: 50% para empezar y 50% cuando tu página esté publicada. Puedes pagar con tarjeta, Apple Pay o Google Pay en un link de pago seguro de Square, o por Cash App a <b>$DakraStudio</b>. Después de cada pago recibes un recibo por mensaje." data-en="Only two payments: 50% to start and 50% when your website is live. You can pay by card, Apple Pay or Google Pay through a secure Square payment link, or by Cash App to <b>$DakraStudio</b>. You get a receipt by message after each payment."></li>
    </ul>

    <h2><span>3</span><b data-es="Qué necesitamos de ti" data-en="What we need from you"></b></h2>
    <p data-es="Menú o lista de servicios con precios actuales, de 3 a 6 fotos de tu negocio o productos, tu horario y cómo atiendes (para llevar, entregas, formas de pago). Tú eres responsable de que esa información sea correcta y de tener permiso para usar las fotos que nos mandes." data-en="Your menu or list of services with current prices, 3 to 6 photos of your business or products, your hours and how you serve customers (takeout, delivery, payment methods). You are responsible for that information being correct and for having permission to use the photos you send."></p>

    <h2><span>4</span><b data-es="Tiempos" data-en="Timeline"></b></h2>
    <p data-es="La primera versión completa está lista de 5 a 7 días después de recibir tu información y el anticipo. Si algo se retrasa, te avisamos por mensaje." data-en="The first complete version is ready 5 to 7 days after we receive your information and the deposit. If anything is delayed, we'll let you know by message."></p>

    <h2><span>5</span><b data-es="Cambios" data-en="Changes"></b></h2>
    <ul>
      <li data-es="Antes de publicar, incluye dos rondas de cambios a la primera versión." data-en="Before publishing, two rounds of changes to the first version are included."></li>
      <li data-es="Durante el primer mes después de publicar, los cambios pequeños (precios, horario, textos, fotos) no tienen costo." data-en="During the first month after publishing, small changes (prices, hours, text, photos) are free."></li>
      <li data-es="Después del primer mes, los cambios entran en el mantenimiento mensual o se cotizan aparte antes de hacerlos." data-en="After the first month, changes are covered by monthly maintenance or quoted separately before we make them."></li>
    </ul>

    <h2><span>6</span><b data-es="Si no te convence" data-en="If you're not happy"></b></h2>
    <p data-es="Si después de ver la primera versión decides no seguir, nos avisas por mensaje y no pagas el 50% restante. El anticipo cubre el trabajo ya hecho y no se devuelve." data-en="If after seeing the first version you decide not to continue, just tell us by message and you don't pay the remaining 50%. The deposit covers the work already done and is not refunded."></p>

    <h2><span>7</span><b data-es="Dominio" data-en="Domain"></b></h2>
    <p data-es="Si quieres un nombre propio (por ejemplo, tunegocio.com), su costo se cobra al precio real (normalmente de $12 a $20 al año) y se renueva cada año. Te avisamos con anticipación antes de cada renovación." data-en="If you want your own name (for example, yourbusiness.com), it is charged at actual cost (usually $12 to $20 per year) and renews every year. We'll remind you ahead of each renewal."></p>

    <h2><span>8</span><b data-es="Mensualidades" data-en="Monthly services"></b></h2>
    <p data-es="Los servicios mensuales (mantenimiento o asistente de chat) se pagan mes a mes y puedes cancelarlos cuando quieras avisando por mensaje antes de la siguiente fecha de pago." data-en="Monthly services (maintenance or chat assistant) are paid month to month and you can cancel anytime by letting us know before the next payment date."></p>

    <h2><span>9</span><b data-es="La página es tuya" data-en="The website is yours"></b></h2>
    <p data-es="Cuando terminas de pagar, la página y su contenido son tuyos. Dakra Studio puede mostrarla como ejemplo de su trabajo, salvo que nos pidas que no." data-en="Once paid in full, the website and its content are yours. Dakra Studio may show it as an example of its work, unless you ask us not to."></p>

    <div class="box"><b data-es="Cómo aceptar" data-en="How to accept"></b><p style="margin:4px 0 0" data-es="Responde <b>“Acepto”</b> al mensaje donde te mandamos este acuerdo y el precio. Con eso y el anticipo, empezamos." data-en="Reply <b>“I accept”</b> to the message where we sent this agreement and the price. With that and the deposit, we get started."></p></div>

    <p class="note" data-es="Contacto: mensajes de texto al (931) 292-2496 · dakrastudio@gmail.com" data-en="Contact: text (931) 292-2496 · dakrastudio@gmail.com"></p>
  </article>
</main>
<footer data-es="© Dakra Studio · Acuerdo vigente desde noviembre de 2026" data-en="© Dakra Studio · Agreement effective November 2026"></footer>
<script>
  let lang="es";
  function render(){
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-es]").forEach(el=>el.innerHTML=el.dataset[lang]);
    document.querySelectorAll("[data-lang]").forEach(b=>b.textContent=lang==="es"?"English":"Español");
  }
  document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=lang==="es"?"en":"es";render();}));
  render();
</script>
</body>
</html>
