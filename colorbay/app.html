<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ColorBay Shop · App</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/app-apple.png">
<link rel="icon" type="image/png" href="icons/app-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ColorBay">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1456b8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: inicio de sesión con PIN; luego barra lateral en PC y barra inferior en celular; la orden se abre en un panel */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --line:#d9dfe5;
  --ink:#16202a; --muted:#5d6b78;
  --bay:#1456b8; --bay-soft:#e3ecfa; --navy:#0c2347;
  --paint:#e8541c; --paint-soft:#fde9df; --tape:#e9d9a8;
  --ok:#1f8a4c; --ok-soft:#e1f3e8; --warn:#b7791f; --warn-soft:#fbf0dc; --bad:#c2352b; --bad-soft:#f9e1df;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(16,30,50,.06),0 6px 20px rgba(16,30,50,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1419; --surface:#171e26; --surface-2:#1d2630; --line:#2a3542;
  --ink:#e8edf2; --muted:#93a1ae; --bay:#5b94ef; --bay-soft:#1b2a40;
  --paint:#ff7a45; --paint-soft:#3a2117; --ok:#46c07a; --ok-soft:#163222; --warn:#e2a948; --warn-soft:#3a2d14; --bad:#ef6b5f; --bad-soft:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1419; --surface:#171e26; --surface-2:#1d2630; --line:#2a3542;
  --ink:#e8edf2; --muted:#93a1ae; --bay:#5b94ef; --bay-soft:#1b2a40;
  --paint:#ff7a45; --paint-soft:#3a2117; --ok:#46c07a; --ok-soft:#163222; --warn:#e2a948; --warn-soft:#3a2d14; --bad:#ef6b5f; --bad-soft:#3a1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
/* Sin zoom por doble toque ni pellizco: el taller se usa con manos sucias */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
button,a,[role=button],.part,.zone,.kcard,.ph,.row,.user,.pad button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pad button,.user,.tab,.nav-btn,.pill-btn,.btn{-webkit-user-select:none;user-select:none}
#root{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
a{color:var(--bay)}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--bay);outline-offset:2px}

/* ---- Nube ---- */
.cform{display:flex;flex-direction:column;gap:10px}
.cin{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:13px 14px;font-size:16px;width:100%}
.cin::placeholder{color:rgba(255,255,255,.5)}
.cerr{color:#ffb39a;font-size:14px;min-height:1.2em}
.legal-link{color:#fff;text-decoration:none;border:1.5px solid rgba(255,255,255,.35);border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px}
.legal-link:active{background:rgba(255,255,255,.1)}
.agree-row{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.4;cursor:pointer}
.agree-row input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--paint,#e8541c)}
.seg.dark{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15)}
.seg.dark button{color:rgba(255,255,255,.7);flex:1}
.seg.dark button.on{background:#fff;color:var(--navy)}
.sync{position:fixed;left:14px;bottom:14px;z-index:15;font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--muted)}
.sync.ok{color:var(--ok)}.sync.err{color:var(--bad)}
@media (max-width:900px){.sync{bottom:78px}}
.codebox{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:.25em;color:var(--bay)}
/* ---- Lista desplegable (escribir o escoger) ---- */
.combo{display:block;position:relative;min-width:0;width:100%}
.combo>input{padding-right:42px!important;width:100%}
.combo-btn{position:absolute;right:4px;top:4px;height:calc(100% - 8px);min-height:30px;width:34px;border:0;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:14px;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.tbl .combo-btn{width:28px;right:2px;top:2px;height:calc(100% - 4px)}
.combo-pop{display:none;margin-top:6px;max-height:232px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow);text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.combo.open .combo-pop{display:block;animation:rise .15s ease both}
.combo-pop button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 14px;font-size:16px;cursor:pointer;touch-action:pan-y;color:var(--ink)}
.combo-pop button:last-child{border-bottom:0}
.combo-pop button:active,.combo-pop button:hover{background:var(--bay-soft)}
.combo-pop .hint{padding:10px 14px;font-size:13px;color:var(--muted)}
/* ---- Interruptor ---- */
.switch{display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:600;font-size:15px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch span{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--bay);outline-offset:2px}
.report .paid{display:inline-block;margin-top:8px;border:3px solid #1f8a4c;color:#1f8a4c;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.12em;padding:2px 12px;transform:rotate(-6deg)}
.report.doc th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#5d6b78}
@media print{
  @page{margin:12mm}
  body{background:#fff!important}
  body>*:not(#over){display:none!important}
  #over{position:static!important;transform:none!important;overflow:visible!important;background:#fff!important;display:block!important}
  #over .over-bar{display:none!important}
  .report{box-shadow:none!important;margin:0!important;max-width:none!important;padding:0!important}
  .report figure{break-inside:avoid}
}
/* ---- Ayuda ---- */
.helpbtn{position:fixed;right:16px;bottom:16px;z-index:16;width:52px;height:52px;border-radius:50%;border:0;background:var(--paint);color:#fff;font-family:var(--display);font-size:28px;font-weight:700;box-shadow:0 8px 24px rgba(232,84,28,.4);cursor:pointer;transition:transform .15s}
.helpbtn:active{transform:scale(.92)}
.helpbtn[hidden]{display:none}
@media (max-width:900px){.helpbtn{bottom:80px;width:48px;height:48px}}
.htopic{border-bottom:1px solid var(--line)}
.htopic:last-child{border-bottom:0}
.htopic summary{list-style:none;cursor:pointer;padding:13px 2px;font-weight:600;display:flex;justify-content:space-between;gap:10px}
.htopic summary::-webkit-details-marker{display:none}
.htopic summary::after{content:"+";color:var(--paint);font-family:var(--display);font-size:22px;line-height:1}
.htopic[open] summary::after{content:"−"}
.htopic ol{margin:0 0 10px;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.htopic .go{margin:0 0 14px}
/* ---- Login ---- */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 80% -10%,#1d4f9c 0,transparent 60%),var(--navy);color:#fff}
.login-card{width:min(440px,100%);display:flex;flex-direction:column;gap:18px;animation:rise .5s ease both}
.tape{display:inline-block;background:var(--tape);color:#3d3420;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:4px 14px;transform:rotate(-2deg);box-shadow:0 2px 0 rgba(0,0,0,.15);clip-path:polygon(2% 0,98% 4%,100% 100%,0 96%)}
.login h1{font-size:44px;line-height:1}
.login .shopname{opacity:.75}
.users{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.user{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);border-radius:14px;padding:14px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;transition:background .2s,border-color .2s,transform .15s}
.user:hover{background:rgba(255,255,255,.12)}
.user.on{border-color:var(--paint);background:rgba(232,84,28,.18)}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:19px;color:#fff;flex:none}
.user small{opacity:.7;font-size:12px}
.pinrow{display:flex;justify-content:center;gap:14px;margin:4px 0}
.pinrow i{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5);transition:background .15s,transform .15s}
.pinrow i.f{background:var(--paint);border-color:var(--paint);transform:scale(1.1)}
.pinrow.shake{animation:shake .4s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:58px;border-radius:14px;border:0;background:rgba(255,255,255,.1);color:#fff;font-family:var(--display);font-size:26px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
.pad button:hover{background:rgba(255,255,255,.18)}
.pad button:active{transform:scale(.95)}
.login .hint{font-size:13px;opacity:.75;text-align:center}
.login a{color:#fff;opacity:.8}
.login .pill-btn{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.login .pill-btn.on{background:#fff;color:var(--navy);border-color:#fff}

/* ---- App ---- */
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--bay),#0b3a85);display:grid;place-items:center;position:relative;overflow:hidden;flex:none}
.brand-mark::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:var(--paint);right:-4px;bottom:-4px;animation:drip 4s ease-in-out infinite}
.brand-name{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.brand-name small{display:block;font-family:var(--body);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);font-weight:600;text-align:left;transition:background .2s,color .2s}
.nav-btn svg{width:20px;height:20px;flex:none}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--bay-soft);color:var(--bay)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:8px}
.me{display:flex;align-items:center;gap:10px}
.me .ava{width:34px;height:34px;font-size:15px}
.me b{display:block;font-size:14px;line-height:1.1}
.me small{color:var(--muted);font-size:12px}
.pill-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600}
.pill-btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

main{overflow-y:auto;padding:24px clamp(16px,3vw,36px) 100px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:34px;line-height:1}
.top p{margin:4px 0 0;color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s,background .2s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn-pri{background:var(--bay);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--bay) 35%,transparent)}
.btn-paint{background:var(--paint);color:#fff}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{padding:16px;position:relative;overflow:hidden}
.stat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stat .val{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.1;margin-top:6px}
.stat .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
.grid2>*{min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sec-h h2{font-size:20px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.thumb{width:52px;height:40px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro{font-family:var(--display);font-weight:700;color:var(--bay);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.c-bay{color:var(--bay);background:var(--bay-soft);border-color:transparent}
.c-paint{color:var(--paint);background:var(--paint-soft);border-color:transparent}
.c-ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.c-warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.c-bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.phasebar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);margin:14px 16px 6px}
.phasebar span{height:100%;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 16px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.alert:last-child{border-bottom:0}
.alert b{font-family:var(--display);font-size:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
.toolbar .input{max-width:320px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;min-height:60vh;align-items:flex-start}
.col{flex:0 0 250px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;transition:background .2s,border-color .2s}
.col.over{background:var(--bay-soft);border-color:var(--bay)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:700;font-size:17px;padding:2px 4px}
.col-h .n{font-family:var(--body);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:grab;box-shadow:var(--shadow);transition:transform .15s}
.kcard:hover{transform:translateY(-2px)}
.kcard.dragging{opacity:.5}
.kcard .kt{display:flex;justify-content:space-between;align-items:center}
.kcard .km{font-size:13px;color:var(--muted);margin:2px 0 8px}
.kcard .kb{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kmove{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-width:30px;height:28px;cursor:pointer;font-weight:700}
.mini-ava{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff}

/* Panel de orden */
.scrim{position:fixed;inset:0;background:rgba(10,18,28,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg);z-index:21;transform:translateX(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.sheet-h{background:var(--bay);color:#fff;padding:14px 18px 0}
.sheet-h .r1{display:flex;align-items:center;gap:10px}
.sheet-h h2{font-size:26px;flex:1;min-width:0}
.x{border:0;background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:20px;flex:none}
.hbtn{border:0;background:rgba(255,255,255,.15);color:#fff;border-radius:10px;cursor:pointer;padding:8px 10px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.25)}
.sheet-h .sub{opacity:.85;font-size:14px;margin:4px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:rgba(255,255,255,.7);padding:10px 12px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:#fff;border-bottom-color:#fff}
.sheet-b{flex:1;overflow-y:auto;padding:16px 18px 40px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-f{background:var(--bay);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.sheet-f .big{font-family:var(--display);font-size:24px}
.pane{animation:rise .3s ease both}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
.box-h{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box-b{padding:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.form .full{grid-column:1/-1}

/* Diagrama de impacto (vehículo) */
.impact{display:grid;justify-items:center}
.impact svg{width:min(300px,100%);height:auto}
.zone{cursor:pointer}
.zone circle{fill:var(--surface);stroke:var(--muted);stroke-width:1.5;transition:fill .2s,stroke .2s}
.zone.sel circle{fill:var(--paint);stroke:var(--paint)}
.zone.sel.prim circle{animation:glow 1.6s ease-in-out infinite}
.car-body{fill:var(--surface-2);stroke:var(--muted);stroke-width:1.5}
.car-glass{fill:var(--line)}

/* Inspección por partes */
.insp{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:16px;align-items:start}
.insp>div:first-child>svg{width:100%;height:auto;max-width:300px;display:block;margin:0 auto}
.part{cursor:pointer}
.part rect,.part ellipse{stroke:var(--muted);stroke-width:1.3;transition:fill .25s,stroke .2s,stroke-width .2s}
.part:hover rect,.part:hover ellipse{stroke:var(--bay);stroke-width:2}
.part.cur rect,.part.cur ellipse{stroke:var(--bay);stroke-width:3}
.part .cnt{font-size:11px;font-weight:700;fill:#fff;pointer-events:none}
.part .cntbg{fill:var(--bay);pointer-events:none}
.sev0{fill:var(--surface-2)} .sev1{fill:#f4d58a} .sev2{fill:#f39a5b} .sev3{fill:#d9483c}
.sevkey{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.sevkey i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle;border:1px solid var(--line)}
.partlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--ok);transition:width .6s cubic-bezier(.2,.8,.2,1)}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.photos.four{grid-template-columns:repeat(4,1fr)}
.ph{aspect-ratio:4/3;border-radius:10px;border:1px dashed var(--line);background:var(--surface-2);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;transition:border-color .2s,transform .15s;text-align:center;padding:4px}
.ph:hover{border-color:var(--bay)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.has{border-style:solid}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;padding:14px 6px 5px;font-size:11px;line-height:1.2}
.ph svg{width:26px;height:26px}
.ph.pop{animation:popin .4s cubic-bezier(.2,.9,.3,1.3)}

/* Tablas */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl input{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;width:100%}
.tbl input:hover,.tbl input:focus{border-color:var(--line);background:var(--surface)}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
.del:hover{color:var(--bad)}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 18px;padding:14px;font-size:15px}
.totals .gt{font-family:var(--display);font-size:24px;font-weight:700}
.status{border:0;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;cursor:pointer}

/* Firma */
.sigpad{width:100%;height:160px;border:1px dashed var(--muted);border-radius:10px;background:var(--surface-2);touch-action:none;cursor:crosshair;display:block}
.sigimg{max-width:100%;height:110px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}

/* Fases */
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:10px 0;position:relative}
.step::before{content:"";position:absolute;left:13px;top:30px;bottom:-10px;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step.done::before{background:var(--ok)}
.sdot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:1;color:#fff;font-size:14px}
.step.done .sdot{background:var(--ok);border-color:var(--ok)}
.step.cur .sdot{background:var(--paint);border-color:var(--paint);animation:glow 1.6s infinite}
.step .sn{font-weight:600}
.step .sd{font-size:13px;color:var(--ok)}
.step.cur .sd{color:var(--paint)}
.note{padding:12px 14px;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note .nh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:4px;gap:8px}
.swatch{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);flex:none}
.gbar{height:6px;border-radius:3px;background:var(--paint);margin-top:4px;transition:width .6s}

/* Pintura */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.fcard{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .15s}
.fcard:hover{transform:translateY(-2px)}
.fcard .code{font-family:var(--display);font-size:22px;font-weight:700;line-height:1}
.stock{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.stock:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:16px}
.qty b{min-width:44px;text-align:center}

/* Modales y capas */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:40;padding:16px;pointer-events:none}
.modal .mcard{width:min(560px,100%);max-height:90vh;max-height:90dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:scale(.95);opacity:0;transition:transform .2s,opacity .2s;pointer-events:none}
.modal.on .mcard{transform:none;opacity:1;pointer-events:auto}
.modal .mcard .sec-h{position:sticky;top:0;background:var(--surface);z-index:1}
.mb{padding:16px}
.mscrim{position:fixed;inset:0;background:rgba(10,18,28,.5);z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.mscrim.on{opacity:1;pointer-events:auto}
.over{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.over.on{transform:none}
.over-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--navy);color:#fff}
.over-bar b{font-family:var(--display);font-size:20px}

/* Reporte */
.report{max-width:860px;margin:20px auto 60px;background:#fff;color:#16202a;border-radius:6px;box-shadow:var(--shadow);padding:clamp(18px,4vw,44px);color-scheme:light}
.report h1{font-size:32px}
.report h3{font-size:20px;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #16202a}
.report .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 24px;font-size:14px;margin-top:14px}
.report .meta span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5d6b78;font-weight:600}
.report .rph{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.report figure{margin:0}
.report figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid #d9dfe5}
.report figcaption{font-size:12px;color:#5d6b78;margin-top:3px}
.report .stage{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:10px 0 6px}
.report table{width:100%;border-collapse:collapse;font-size:14px}
.report td,.report th{padding:6px 8px;border-bottom:1px solid #e3e7eb;text-align:left}
.report .foot{margin-top:30px;font-size:12px;color:#5d6b78;border-top:1px solid #d9dfe5;padding-top:12px}
.report .sev{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}

/* Vista del cliente */
.phone{width:min(360px,100%);margin:24px auto 60px;background:#fff;color:#16202a;border-radius:34px;border:10px solid #111;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden;color-scheme:light}
.phone .ph-top{background:var(--navy);color:#fff;padding:22px 18px 18px}
.phone .ph-top h2{font-size:26px;line-height:1.05;margin-top:8px}
.phone .ph-b{padding:16px 18px 22px;display:flex;flex-direction:column;gap:14px}
.cprog{display:flex;flex-direction:column;gap:0}
.cstep{display:flex;gap:10px;align-items:center;font-size:14px;padding:5px 0;color:#9aa5b1}
.cstep i{width:14px;height:14px;border-radius:50%;border:2px solid #cfd6dd;flex:none}
.cstep.d{color:#16202a}.cstep.d i{background:#1f8a4c;border-color:#1f8a4c}
.cstep.c{color:#e8541c;font-weight:700}.cstep.c i{background:#e8541c;border-color:#e8541c;animation:glow 1.6s infinite}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:70vh;border-radius:8px}
.lb .lbbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(640px,100%)}
.lb input{flex:1;min-width:180px;border-radius:10px;border:0;padding:10px 12px}

.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:all .3s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.bottom{display:none}
.view{animation:rise .35s ease both}
.stagger>*{animation:rise .4s ease both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes popin{from{transform:scale(.8)}to{transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(232,84,28,.5);filter:none}50%{box-shadow:0 0 0 8px transparent;filter:brightness(1.15)}}
@keyframes drip{0%,100%{transform:translate(0,0)}50%{transform:translate(-3px,-3px) scale(1.15)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.mobile-top{display:none;align-items:center;justify-content:space-between;margin:-8px 0 14px;gap:8px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom .nav-btn{flex-direction:column;gap:3px;font-size:11px;padding:6px 6px}
  .stats{grid-template-columns:1fr 1fr}
  .grid2{grid-template-columns:1fr}
  .mobile-top{display:flex}
  .insp{grid-template-columns:1fr}
}
@media (max-width:900px){input,select,textarea{font-size:16px!important}}
@media (max-width:520px){
  .form{grid-template-columns:1fr}
  .photos,.photos.four{grid-template-columns:repeat(2,1fr)}
  .top h1{font-size:28px}
  .stat .val{font-size:30px}
  .tbl .hide-s{display:none}
  .sheet-h h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtn span{display:none}
  .row{padding:12px}
  .row .chip{font-size:11px;padding:2px 7px}
  .thumb{width:44px;height:36px}
  .users{grid-template-columns:repeat(2,1fr)}
}

/* Mientras hay una ventana abierta, la pantalla de atrás no se mueve */
body.lock main{overflow:hidden}
@media (max-width:600px){
  .modal{place-items:end center;padding:0}
  .modal .mcard{width:100%;max-height:94dvh;border-radius:18px 18px 0 0;transform:translateY(100%);padding-bottom:env(safe-area-inset-bottom)}
  .modal.on .mcard{transform:none}
}
/* iPhone: las fechas no deben salirse del cuadro */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.form>*{min-width:0}

function stamp(g,w,h,ro,date){

    c.addEventListener("dragstart",e=>{dragId=c.dataset.id;c.classList.add("dragging");try{e.dataTransfer.setData("text/plain",dragId)}catch(x){}});
    c.addEventListener("dragend",()=>c.classList.remove("dragging"));
    c.addEventListener("click",e=>{if(!e.target.closest("button"))openOrder(c.dataset.id)});});
  document.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("over")});
    col.addEventListener("dragleave",()=>col.classList.remove("over"));
    col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("over");if(dragId)setPhase(dragId,+col.dataset.col)});});
}
function setPhase(id,p){const o=S.orders.find(x=>x.id===id);if(!o)return;
  o.phase=p;for(let i=0;i<=p;i++)if(!o.log[PH[i]])o.log[PH[i]]=today();
  for(let i=p+1;i<PH.length;i++)delete o.log[PH[i]];
  save();toast(`#${id} → ${t("ph")[PH[p]]}`);render();if(openId===id)renderSheet()}

function editFormula(id,fromOrder){
  const f=id?S.paint.library.find(x=>x.id===id):{id:"f"+uid(),code:"",name:"",brand:"",make:"",tn:[{n:"",g:0}]};
  const draft=JSON.parse(JSON.stringify(f));let mix=draft.tn.reduce((s,x)=>s+ +x.g,0);
  const draw=()=>{const sum=draft.tn.reduce((s,x)=>s+(+x.g||0),0),k=sum?(mix||sum)/sum:0;
    $("#fe-rows").innerHTML=draft.tn.map((x,i)=>`<tr><td><input data-fi="${i}" data-k="n" value="${esc(x.n)}" placeholder="${t("toner")}"></td><td class="r" style="width:90px"><input class="num" style="text-align:right" type="number" step="any" data-fi="${i}" data-k="g" value="${x.g}"></td><td class="r num" style="width:80px"><b>${(x.g*k).toFixed(1)}</b></td><td><button type="button" class="del" data-fd="${i}">×</button></td></tr>`).join("");
    document.querySelectorAll("[data-fi]").forEach(inp=>inp.onchange=()=>{draft.tn[+inp.dataset.fi][inp.dataset.k]=inp.dataset.k==="g"?+inp.value:inp.value;draw()});
    document.querySelectorAll("[data-fd]").forEach(b=>b.onclick=()=>{draft.tn.splice(+b.dataset.fd,1);draw()});};
  openModal(`<div class="sec-h"><h2>${id?esc(f.code):t("newFormula")}</h2><button class="del" onclick="closeModal()">×</button></div>
   <form class="mb" id="fe"><div class="form"><label>${t("paintCode")}<input class="input" id="fe-code" value="${esc(f.code)}" required></label><label>${t("color")}<input class="input" id="fe-name" value="${esc(f.name)}"></label>
   <label>${t("paintBrand")}<input class="input" id="fe-brand" list="dl-brands" autocomplete="off" value="${esc(f.brand)}"></label><label>${t("make")}<input class="input" id="fe-make" list="dl-makes" autocomplete="off" value="${esc(f.make)}"></label>
   <label class="full">${t("mixFor")}<input class="input num" id="fe-mix" type="number" step="any" min="0" value="${Math.round(mix*10)/10}"></label></div>
   <table class="tbl" style="margin-top:12px"><thead><tr><th>${t("toner")}</th><th class="r">${t("grams")}</th><th class="r">${t("scaled")}</th><th></th></tr></thead><tbody id="fe-rows"></tbody></table>
   <button type="button" class="btn btn-ghost btn-sm" id="fe-addt" style="margin-top:8px">＋ ${t("addToner")}</button>
   <div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap"><span style="display:flex;gap:8px">${id?`<button type="button" class="btn btn-ghost" id="fe-del" style="color:var(--bad)">${t("delete")}</button>`:""}<button type="button" class="btn btn-paint" id="fe-log">${t("logMix")}</button></span><button class="btn btn-pri">${t("save")}</button></div></form>`,()=>{
    let farm=false;const fd=$("#fe-del");if(fd)fd.onclick=e=>{if(!farm){farm=true;e.target.textContent=t("sure");return}trashAdd("formula",f,f.code+" "+(f.name||""));S.paint.library=S.paint.library.filter(x=>x.id!==f.id);save();closeModal();render()};
    draw();$("#fe-mix").onchange=e=>{mix=+e.target.value;draw()};$("#fe-addt").onclick=()=>{draft.tn.push({n:"",g:0});draw()};
    const collect=()=>{Object.assign(draft,{code:$("#fe-code").value.trim().toUpperCase(),name:$("#fe-name").value.trim(),brand:$("#fe-brand").value.trim(),make:$("#fe-make").value.trim()})};
    $("#fe-log").onclick=()=>{collect();S.paint.mixes.push({id:"m"+uid(),d:today(),code:draft.code,order:fromOrder||"",g:Math.round(mix||draft.tn.reduce((s,x)=>s+ +x.g,0)),by:ME.id});save();toast(t("saved"))};
    $("#fe").onsubmit=e=>{e.preventDefault();collect();const i=S.paint.library.findIndex(x=>x.id===draft.id);if(i>=0)S.paint.library[i]=draft;else S.paint.library.push(draft);save();closeModal();toast(t("saved"));render()};});
}

let openId=null,tab="vehicle",curPart=null,stage="before";
function lockBg(){document.body.classList.toggle("lock",["#sheet","#modal","#over","#lb"].some(s=>$(s)?.classList.contains("on")))}
function openOrder(id){openId=id;tab="vehicle";curPart=null;renderSheet();$("#sheet").classList.add("on");$("#scrim").classList.add("on");lockBg()}
function closeSheet(silent){openId=null;$("#sheet").classList.remove("on");$("#scrim").classList.remove("on");lockBg();if(!silent)render()}
$("#scrim").onclick=()=>closeSheet();
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if($("#lb").classList.contains("on"))closeLb();else if($("#modal").classList.contains("on"))closeModal();else if($("#over").classList.contains("on"))closeOver();else if(openId)closeSheet()});

function renderSheet(){
  const o=S.orders.find(x=>x.id===openId);if(!o)return closeSheet();

    <button class="hbtn" onclick="openReport('${o.id}')" title="${t("report")}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h4"/></svg><span>${t("report")}</span></button>
    ${can("money")?`<button class="hbtn" onclick="openCustView('${o.id}')" title="${t("custView")}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><span>${t("custView")}</span></button>`:""}</div>
   <div class="sub"><span>${o.year} ${esc(o.make)} ${esc(o.model)} ${esc(o.trim||"")}</span>${phaseChipLight(o)}${o.payer==="ins"?`<span class="chip" style="background:rgba(255,255,255,.18);color:#fff;border-color:transparent">${esc(o.insurer||t("payerIns"))}</span>`:""}</div>
   <div class="tabs" role="tablist">${tabsFor().map(k=>`<button class="tab ${tab===k?"on":""}" role="tab" onclick="tab='${k}';renderSheet()">${t(k)}</button>`).join("")}</div></div>
   <div class="sheet-b" id="sheet-b"><div class="pane">${({vehicle:pVeh,inspection:pInsp,estimate:pEst,parts:pParts,phases:pPhases,notes:pNotes,payments:pPays,formula:pForm})[tab](o)}</div></div>
   ${can("money")?`<div class="sheet-f"><span>${t("balance")}: <span class="big num">${money(tt.bal)}</span></span><span class="num" style="opacity:.85">${t("total")} ${money(tt.tot)}</span></div>`:""}`;

function wireSig(cv,o){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const g=cv.getContext("2d");g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap="round";g.lineJoin="round";g.strokeStyle="#16202a";
  let draw=false,dirty=false,last=null;const pt=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{draw=true;last=pt(e);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!draw)return;const p=pt(e);g.beginPath();g.moveTo(...last);g.lineTo(...p);g.stroke();last=p;dirty=true};
  cv.onpointerup=cv.onpointercancel=()=>{draw=false};
  $("#sig-reset").onclick=()=>{g.clearRect(0,0,cv.width,cv.height);dirty=false};
  $("#sig-save").onclick=()=>{if(!dirty){toast(t("signHere"));return}
    const out=document.createElement("canvas");out.width=cv.width;out.height=cv.height;const og=out.getContext("2d");og.fillStyle="#fff";og.fillRect(0,0,out.width,out.height);og.drawImage(cv,0,0);
    o.sig={img:out.toDataURL("image/jpeg",.8),name:$("#sig-name").value.trim(),d:today(),total:totals(o).tot};save();toast(t("saved"));renderSheet()};
}

/* ---------- Papelera ---------- */
function trashAdd(kind,item,label){
  const it=JSON.parse(JSON.stringify(item));it._by=ME?.id||null;
  if(DEMO){(S.trash=S.trash||[]).unshift({id:"t"+uid(),kind,label,item:it,deleted_at:new Date().toISOString()});save()}
  else if(SHOP)sb.from("trash").insert({shop_id:SHOP.id,kind,label,item:it}).then(({error})=>{if(error)console.error("trash",error)});
  toast(t("toTrash"));
}
async function trashList(){
  if(DEMO){purgeTrash();return S.trash||[]}
  const{data,error}=await sb.from("trash").select("id,kind,label,item,deleted_at").eq("shop_id",SHOP.id).order("deleted_at",{ascending:false});
  if(error){toast(t("errNet"));return[]}return data||[];
}
const trashPhotoIds=e=>e.kind==="photo"?[e.item.ph?.id||e.item.id].filter(Boolean):e.kind==="order"?[...Object.values(e.item.photosGen||{}),...Object.values(e.item.insp||{}).flatMap(p=>(p.ph||[]).map(x=>x.id))]:[];
async function purgeTrash(){
  const lim=Date.now()-30*DAY;
  if(DEMO){if(S.trash?.length){const before=S.trash.length;S.trash=S.trash.filter(e=>Date.parse(e.deleted_at)>lim);if(S.trash.length!==before)save()}return}
  if(ME?.role!=="owner"||!SHOP)return;
  const{data}=await sb.from("trash").select("id,kind,item,deleted_at").eq("shop_id",SHOP.id).lt("deleted_at",new Date(lim).toISOString());
  if(!data?.length)return;
  const ph=data.flatMap(trashPhotoIds).map(id=>`${SHOP.id}/${id}.jpg`);if(ph.length)await sb.storage.from("photos").remove(ph).catch(()=>{});
  await sb.from("trash").delete().in("id",data.map(e=>e.id));
}
function trashRestore(e){
  const it={...e.item};delete it._by;
  if(e.kind==="order"){if(S.orders.some(o=>o.id===it.id))it.id=String(Math.max(1000,...S.orders.map(o=>+o.id||0))+1);S.orders.push(it)}
  if(e.kind==="customer"&&!S.customers.some(c=>c.id===it.id))S.customers.push(it);
  if(e.kind==="formula")S.paint.library.push(it);
  if(e.kind==="stock")S.paint.stock.push(it);
  if(e.kind==="appt")(S.appts=S.appts||[]).push(it);
  const o=it.orderId&&S.orders.find(x=>x.id===it.orderId);
  if(e.kind==="note"&&o)o.notes.unshift(it.note);
  if(e.kind==="photo"&&o){if(it.gen){o.photosGen=o.photosGen||{};if(!o.photosGen[it.gen])o.photosGen[it.gen]=it.id}else{o.insp[it.part]=o.insp[it.part]||{sev:0,ph:[]};o.insp[it.part].ph.push(it.ph)}}
  save();
}
async function openTrash(){
  const list=await trashList();
  const draw=items=>`<div class="sec-h"><h2>${t("trash")}</h2><button class="del" onclick="closeModal()">×</button></div><div class="mb">
   ${items.length?items.map((e,i)=>{const left=Math.max(0,30-Math.floor((Date.now()-Date.parse(e.deleted_at))/DAY));
    return`<div class="row" style="cursor:default;padding:10px 0"><div class="main"><div class="t1">${esc(t("kinds")[e.kind]||e.kind)} · ${esc(e.label||"")}</div><div class="t2">${fmtTS(e.deleted_at)} · ${left} ${t("daysKeep")}</div></div><button class="btn btn-ghost btn-sm" data-tr="${i}">${t("restore")}</button></div>`}).join(""):`<div class="empty">${t("trashEmpty")}</div>`}</div>`;
  openModal(draw(list),()=>wire());
  function wire(){document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=async()=>{const e=list[+b.dataset.tr];trashRestore(e);
    if(DEMO){S.trash=S.trash.filter(x=>x.id!==e.id);save()}else await sb.from("trash").delete().eq("id",e.id);
    list.splice(+b.dataset.tr,1);toast(t("restored"));$("#modal-card").innerHTML=draw(list);wire();render();if(openId)renderSheet()})}
}

/* ---------- Leer VIN (servicio gratis de NHTSA) ---------- */
async function decodeVin(vin){
  vin=String(vin||"").trim().toUpperCase();if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){toast(t("vinBad"));return null}
  try{const r=await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);const j=await r.json();const x=j.Results?.[0];
    if(!x||!x.Make){toast(t("vinFail"));return null}
    const tc=s=>String(s||"").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()).replace(/\bBmw\b/,"BMW").replace(/\bGmc\b/,"GMC");
    toast(t("vinOk"));return{year:+x.ModelYear||"",make:tc(x.Make),model:x.Model||"",trim:x.Trim||x.Series||""};
  }catch(e){toast(t("vinFail"));return null}
}

let repMonth=null;
function vReports(){
  repMonth=repMonth||today().slice(0,7);const M=repMonth;
  const pays=S.orders.flatMap(o=>(o.pays||[]).map(p=>({...p,o})));
  const collected=pays.filter(p=>(p.d||"").startsWith(M)).reduce((s,p)=>s+ +p.a,0);
  const deliv=S.orders.filter(o=>(o.log?.out||"").startsWith(M));
  const billed=deliv.reduce((s,o)=>s+totals(o).tot,0);
  const recv=S.orders.filter(o=>(o.inDate||"").startsWith(M)).length;
  const days=deliv.map(o=>(Date.parse(o.log.out)-Date.parse(o.log.rec||o.inDate))/DAY).filter(n=>n>=0);
  const avg=days.length?days.reduce((a,b)=>a+b,0)/days.length:0;
  const open=S.orders.map(o=>({o,b:Math.max(0,totals(o).bal)})).filter(x=>x.b>0.005);
  const owedIns=open.filter(x=>x.o.payer==="ins").reduce((s,x)=>s+x.b,0),owedCust=open.filter(x=>x.o.payer!=="ins").reduce((s,x)=>s+x.b,0);
  const months=[...Array(6)].map((_,i)=>{const d=new Date(M+"-15");d.setMonth(d.getMonth()-5+i);return d.toISOString().slice(0,7)});
  const perM=months.map(m=>pays.filter(p=>(p.d||"").startsWith(m)).reduce((s,p)=>s+ +p.a,0));

/* ================== Lista desplegable para campos con sugerencias ================== */
function comboOptions(inp){const dl=document.getElementById(inp.dataset.list);return dl?[...dl.options].map(o=>o.value):[]}
function comboOpen(wrap,all){
  const inp=wrap.querySelector("input"),pop=wrap.querySelector(".combo-pop");
  const q=all?"":inp.value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const items=comboOptions(inp).filter(v=>!q||v.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").includes(q)).slice(0,400);
  document.querySelectorAll(".combo.open").forEach(w=>{if(w!==wrap)w.classList.remove("open")});
  if(!items.length){wrap.classList.remove("open");return}
  pop.innerHTML=items.map(v=>`<button type="button" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  const wasOpen=wrap.classList.contains("open");wrap.classList.add("open");
  if(!wasOpen){pop.scrollTop=0;requestAnimationFrame(()=>{const r=pop.getBoundingClientRect(),vh=(window.visualViewport?.height||innerHeight);if(r.bottom>vh-8||r.top<0)pop.scrollIntoView({block:"nearest",behavior:"smooth"})})}
}
function comboPick(wrap,v){const inp=wrap.querySelector("input");inp.value=v;wrap.classList.remove("open");
  inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}))}
function enhanceCombos(root){
  (root||document).querySelectorAll("input[list]:not([data-combo])").forEach(inp=>{
    inp.dataset.combo="1";inp.dataset.list=inp.getAttribute("list");inp.removeAttribute("list");inp.setAttribute("autocomplete","off");
    const wrap=document.createElement("span");wrap.className="combo";inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);
    const btn=document.createElement("button");btn.type="button";btn.className="combo-btn";btn.setAttribute("aria-label","▾");btn.textContent="▾";wrap.appendChild(btn);
    const pop=document.createElement("div");pop.className="combo-pop";wrap.appendChild(pop);
    btn.addEventListener("pointerdown",e=>e.preventDefault());
    btn.addEventListener("click",()=>{if(wrap.classList.contains("open"))wrap.classList.remove("open");else{if(inp.dataset.list==="dl-models")fillModels(inp.id==="no-md"?$("#no-mk")?.value:S.orders.find(x=>x.id===openId)?.make);comboOpen(wrap,true)}});
    inp.addEventListener("input",e=>{if(e.isTrusted)comboOpen(wrap,false)});
    /* Deslizar mueve la lista; solo un toque sin moverse escoge (click no se dispara si hubo scroll) */
    pop.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")e.preventDefault()});
    pop.addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)comboPick(wrap,b.dataset.v)});
    inp.addEventListener("keydown",e=>{if(e.key==="Escape"||e.key==="Tab")wrap.classList.remove("open")});
  });
}
/* Cerrar la lista solo al tocar fuera de ella (no al quitar el teclado ni al deslizar) */
document.addEventListener("pointerdown",e=>{document.querySelectorAll(".combo.open").forEach(w=>{if(!w.contains(e.target))w.classList.remove("open")})},true);
new MutationObserver(()=>{clearTimeout(enhanceCombos.t);enhanceCombos.t=setTimeout(()=>enhanceCombos(),0)}).observe(document.body,{childList:true,subtree:true});

function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}

const stable=v=>JSON.stringify(v,(k,x)=>x&&typeof x==="object"&&!Array.isArray(x)?Object.keys(x).sort().reduce((o,kk)=>(o[kk]=x[kk],o),{}):x);

let MONEY_ON=false;
function splitOrder(o){
  if(!MONEY_ON)return{pub:o,money:null};
  const pub={...o};delete pub.est;delete pub.pays;
  const money={est:o.est||[],pays:o.pays||[],partCost:{},sigTotal:o.sig?.total??null};
  pub.parts=(o.parts||[]).map(p=>{if(!p.id)p.id=uid();const q={...p};money.partCost[p.id]=+p.c||0;delete q.c;return q});
  if(o.sig){pub.sig={...o.sig};delete pub.sig.total}
  return{pub,money};
}
function mergeOrder(pub,money){
  if(!money)return pub;
  const o={...pub,est:money.est||[],pays:money.pays||[]};
  o.parts=(pub.parts||[]).map(p=>({...p,c:money.partCost?.[p.id]??p.c??0}));
  if(o.sig&&money.sigTotal!=null)o.sig={...o.sig,total:money.sigTotal};
  return o;
}
async function loadMoney(){
  const{data,error}=await sb.from("order_money").select("id,doc").eq("shop_id",SHOP.id);
  if(error){console.error("money",error);return}
  const map={};(data||[]).forEach(r=>map[r.id]=r.doc);
  MONEY_ON=true;CLOUD.snap.money={};
  S.orders=S.orders.map(o=>{const m=map[o.id];if(m)CLOUD.snap.money[o.id]=stable(m);return mergeOrder(o,m)});
}
function dropMoney(){MONEY_ON=false;CLOUD.snap.money={};S.orders=S.orders.map(o=>{const x={...o};delete x.est;delete x.pays;x.parts=(x.parts||[]).map(p=>{const q={...p};delete q.c;return q});return x})}
function scheduleSync(){CLOUD.dirty=true;setSync("saving");clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(syncNow,700)}
async function syncNow(){
  if(!SHOP)return;
  try{
    const now=new Date().toISOString();
    const docObj=cloudDoc(),doc=stable(docObj);
    if(doc!==CLOUD.snap.doc){const{error}=await sb.from("shop_data").update({doc:docObj,updated_at:now}).eq("shop_id",SHOP.id);if(error)throw error;CLOUD.snap.doc=doc}
    const writeMoney=MONEY_ON&&can("money");
    const seen=new Set(),ups=[],mups=[];
    for(const o of S.orders){seen.add(o.id);const{pub,money}=splitOrder(o);const j=stable(pub);
      if(CLOUD.snap.orders[o.id]!==j)ups.push({row:{shop_id:SHOP.id,id:o.id,doc:pub,updated_at:now},j});
      if(writeMoney&&money){const mj=stable(money);if(CLOUD.snap.money[o.id]!==mj)mups.push({row:{shop_id:SHOP.id,id:o.id,doc:money,updated_at:now},j:mj})}}
    if(ups.length){const{error}=await sb.from("orders").upsert(ups.map(u=>u.row));if(error)throw error;ups.forEach(u=>CLOUD.snap.orders[u.row.id]=u.j)}
    if(mups.length){const{error}=await sb.from("order_money").upsert(mups.map(u=>u.row));if(error)throw error;mups.forEach(u=>CLOUD.snap.money[u.row.id]=u.j)}
    const gone=Object.keys(CLOUD.snap.orders).filter(id=>!seen.has(id));
    if(gone.length){const{error}=await sb.from("orders").delete().eq("shop_id",SHOP.id).in("id",gone);if(error)throw error;gone.forEach(id=>delete CLOUD.snap.orders[id]);
      if(writeMoney){await sb.from("order_money").delete().eq("shop_id",SHOP.id).in("id",gone);gone.forEach(id=>delete CLOUD.snap.money[id])}}
    CLOUD.dirty=false;setSync("ok");flushUploads();
  }catch(e){console.error("sync",e);setSync("err");clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(syncNow,5000)}
}

async function flushUploads(){
  if(DEMO||!SHOP||upBusy||!pendingUp.size)return;upBusy=true;

      if(error)throw error;pendingUp.delete(id);savePending()}catch(e){console.error("upload",e);break}}
  upBusy=false;
}

function shopBlocked(s){return s.status!=="active"||(s.plan==="trial"&&new Date(s.trial_ends)<new Date())||((s.plan==="paid"||s.plan==="founder")&&s.paid_until&&new Date(s.paid_until).getTime()+7*DAY<Date.now())}
function renderShell(inner){$("#root").innerHTML=`<div class="login"><div class="login-card"><div><span class="tape">ColorBay Shop</span></div>${inner}
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px"><a href="index.html">${t("backWeb")}</a>${langBtns()}</div></div></div>`}
function renderCloudLogin(){
  if(recovering){renderShell(`<h1>${t("newPass")}</h1><form id="rp" class="cform"><input class="cin" id="rp-p" type="password" minlength="6" autocomplete="new-password" placeholder="${t("newPass")}" required>
    <div class="cerr">${esc(cloudErr)}</div><button class="btn btn-paint">${t("setPass")}</button></form>`);
    $("#rp").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.updateUser({password:$("#rp-p").value});if(error){cloudErr=error.message;renderCloudLogin();return}recovering=false;cloudErr="";enterShop()};return}
  renderShell(`<h1>${t("logIn")}</h1>
   <div class="seg dark">${["owner","worker"].map(k=>`<button class="${loginTab===k?"on":""}" data-lt="${k}">${t(k==="owner"?"ownerTab":"workerTab")}</button>`).join("")}</div>
   ${loginTab==="owner"?`<form id="lf" class="cform"><input class="cin" id="lf-e" type="email" autocomplete="email" placeholder="${t("email")}" required>
     <input class="cin" id="lf-p" type="password" autocomplete="current-password" placeholder="${t("password")}" required>
     <div class="cerr">${esc(cloudErr)}</div><button class="btn btn-paint">${t("logIn")}</button></form>
     <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px"><a href="info.html#prueba">${t("createShop")}</a><a href="#" id="lf-f">${t("forgot")}</a></div>`
   :`<form id="wf" class="cform"><input class="cin" id="wf-c" autocomplete="off" autocapitalize="characters" maxlength="6" placeholder="${t("shopCode")}" style="text-transform:uppercase;letter-spacing:.2em" required>
     <input class="cin" id="wf-p" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="${t("yourPin")}" style="letter-spacing:.4em" required>
     <div class="cerr">${esc(cloudErr)}</div><button class="btn btn-paint">${t("logIn")}</button></form>`}
   <div class="hint"><a href="app.html?demo=1">${t("seeDemo")} →</a></div>`);
  document.querySelectorAll("[data-lt]").forEach(b=>b.onclick=()=>{loginTab=b.dataset.lt;cloudErr="";renderCloudLogin()});
  const lf=$("#lf");if(lf)lf.onsubmit=async e=>{e.preventDefault();cloudErr="";
    const{error}=await sb.auth.signInWithPassword({email:$("#lf-e").value.trim(),password:$("#lf-p").value});
    if(error){cloudErr=/fetch|network/i.test(error.message)?t("errNet"):t("errLogin");renderCloudLogin();return}enterShop()};
  const ff=$("#lf-f");if(ff)ff.onclick=async e=>{e.preventDefault();const em=$("#lf-e").value.trim();if(!em){$("#lf-e").focus();return}
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});toast(t("resetSent"))};
  const wf=$("#wf");if(wf)wf.onsubmit=async e=>{e.preventDefault();cloudErr="";
    let{data:{session}}=await sb.auth.getSession();
    if(!session){const r=await sb.auth.signInAnonymously();if(r.error){cloudErr=/disabled/i.test(r.error.message)?t("errAnon"):t("errNet");renderCloudLogin();return}}
    const{data,error}=await sb.rpc("join_shop",{p_code:$("#wf-c").value,p_pin:$("#wf-p").value});
    const er=error?"net":data?.error;
    if(er){cloudErr=t({bad_code:"errCode",bad_pin:"errPin",too_many_attempts:"errMany",shop_closed:"errClosed"}[er]||"errNet");renderCloudLogin();return}
    try{localStorage.setItem("colorbay-shop-id",data.shop_id)}catch(x){}enterShop()};
}
function renderBlocked(s,role){const canPay=role==="owner"&&s.status==="active"&&stripeOn();
  renderShell(`<h1>${s.status!=="active"?t("pausedT"):s.plan!=="trial"?t("payDueT"):t("trialT")}</h1><div class="shopname">${esc(s.name)}</div>
  ${canPay?`<p style="opacity:.85;margin:0">${t("payKeep")}</p>${payBtns(true)}<p style="opacity:.7;margin:0;font-size:14px">${t("dataSafe")}</p><p style="opacity:.85;margin:0">${t("orText")}</p>`:`<p style="opacity:.85;margin:0">${t("pausedP")}</p>`}<div style="font-family:var(--display);font-size:30px;font-weight:700">+1 (931) 292-2496</div>
  <div style="opacity:.75">dakrastudio@gmail.com</div><button class="btn btn-ghost" onclick="logout()">${t("logout")}</button>`)}
async function enterShop(){
  renderShell(`<h1 style="font-size:32px">${t("loading")}</h1>`);
  const{data:{user}}=await sb.auth.getUser();if(!user){renderCloudLogin();return}
  let{data:mem,error}=await sb.from("members").select("shop_id,worker_id,role").eq("user_id",user.id);
  if(error){cloudErr=t("errNet");renderCloudLogin();return}
  let pending=null;try{pending=JSON.parse(localStorage.getItem("colorbay-pending-shop")||"null")}catch(e){}
  if(!mem?.length&&pending&&!user.is_anonymous){
    renderShell(`<h1 style="font-size:32px">${t("pendingShop")}</h1>`);
    const r=await sb.rpc("create_shop",{p_name:pending.shop,p_owner:pending.name,p_pin:pending.pin,p_phone:pending.phone||null});
    if(!r.error&&pending.ref)try{await sb.rpc("set_referral",{p_shop:r.data,p_code:pending.ref})}catch(e){}
    if(!r.error){try{localStorage.removeItem("colorbay-pending-shop")}catch(e){}({data:mem}=await sb.from("members").select("shop_id,worker_id,role").eq("user_id",user.id))}
  }
  if(!mem?.length){renderShell(`<h1 style="font-size:32px">${t("noShop")}</h1><div class="shopname">${esc(user.email||"")}</div>
    <a class="btn btn-paint" href="info.html#prueba" style="text-decoration:none">${t("createShop")}</a><button class="btn btn-ghost" onclick="logout()">${t("logout")}</button>`);return}
  let pref=null;try{pref=localStorage.getItem("colorbay-shop-id")}catch(e){}
  const m=mem.find(x=>x.shop_id===pref)||mem[0];
  const{data:shop,error:e1}=await sb.from("shops").select("*").eq("id",m.shop_id).single();USER_EMAIL=user.email||"";
  if(e1||!shop){cloudErr=t("errNet");renderCloudLogin();return}
  SHOP=shop;
  if(shopBlocked(shop)){renderBlocked(shop,m.role);return}
  if(!(await termsOk(user.id)))await termsGate(shop.id);
  const[{data:sd,error:e2},{data:ords,error:e3},{data:wk,error:e4}]=await Promise.all([
    sb.from("shop_data").select("doc").eq("shop_id",shop.id).maybeSingle(),
    sb.from("orders").select("id,doc").eq("shop_id",shop.id),
    sb.from("workers").select("id,name,role").eq("shop_id",shop.id)]);
  if(e2||e3||e4){cloudErr=t("errNet");renderCloudLogin();return}
  const doc=sd?.doc||{};const lang=S.settings.lang;
  S={settings:{shop:shop.name,rate:55,paintRate:45,tax:9.75,theme:"auto",...(doc.settings||{}),lang},users:wk||[],customers:doc.customers||[],
     orders:(ords||[]).map(r=>r.doc),paint:{library:[],mixes:[],stock:[],...(doc.paint||{})},appts:doc.appts||[],demo:false};
  CLOUD.snap.doc=stable(cloudDoc());CLOUD.snap.orders={};CLOUD.snap.money={};MONEY_ON=false;S.orders.forEach(o=>CLOUD.snap.orders[o.id]=stable(o));
  ME=S.users.find(u=>u.id===m.worker_id)||{id:m.worker_id,name:user.email||"?",role:m.role};
  if(can("money"))await loadMoney();
  applyTheme();subscribe();flushUploads();render();purgeTrash();paidReturn();
  if(MONEY_ON&&S.orders.some(o=>stable(splitOrder(o).pub)!==CLOUD.snap.orders[o.id]))scheduleSync();
}
function subscribe(){
  if(CH)sb.removeChannel(CH);
  CH=sb.channel("shop-"+SHOP.id)
   .on("postgres_changes",{event:"*",schema:"public",table:"orders",filter:"shop_id=eq."+SHOP.id},p=>{
     if(p.eventType==="DELETE"){const id=p.old?.id;if(!id||!(id in CLOUD.snap.orders))return;delete CLOUD.snap.orders[id];S.orders=S.orders.filter(o=>o.id!==id);if(openId===id)closeSheet(true);softRender();return}
     const o=p.new?.doc;if(!o)return;const j=stable(o);if(CLOUD.snap.orders[o.id]===j)return;
     CLOUD.snap.orders[o.id]=j;const i=S.orders.findIndex(x=>x.id===o.id);const cur=i>=0?splitOrder(S.orders[i]).money:null;const merged=mergeOrder(o,cur);
     if(i>=0)S.orders[i]=merged;else S.orders.push(merged);softRender()})
   .on("postgres_changes",{event:"*",schema:"public",table:"order_money",filter:"shop_id=eq."+SHOP.id},p=>{
     if(!MONEY_ON||p.eventType==="DELETE")return;const r=p.new;if(!r?.doc)return;const mj=stable(r.doc);if(CLOUD.snap.money[r.id]===mj)return;
     CLOUD.snap.money[r.id]=mj;const i=S.orders.findIndex(x=>x.id===r.id);if(i>=0){S.orders[i]=mergeOrder(splitOrder(S.orders[i]).pub,r.doc);softRender()}})
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"shop_data",filter:"shop_id=eq."+SHOP.id},p=>{
     const d=p.new?.doc;if(!d)return;const lang=S.settings.lang;const j=JSON.stringify({...d,settings:{...d.settings,lang}});
     S.settings={...S.settings,...(d.settings||{}),lang};S.customers=d.customers||[];S.paint={...S.paint,...(d.paint||{})};S.appts=d.appts||[];CLOUD.snap.doc=stable(cloudDoc());
     if(can("money")&&!MONEY_ON)loadMoney().then(softRender);else if(!can("money")&&MONEY_ON){dropMoney();if(openId)closeSheet(true)}
     softRender()})
   .subscribe();
}
async function reloadWorkers(){const{data}=await sb.from("workers").select("id,name,role").eq("shop_id",SHOP.id);if(data)S.users=data}
async function bootCloud(){
  renderShell(`<h1 style="font-size:32px">${t("loading")}</h1>`);
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js")}
  catch(e){try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js")}catch(x){cloudErr=t("errNet");renderShell(`<h1>${t("errNet")}</h1>`);return}}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{storageKey:"colorbay-app-auth",persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;ME=null;renderCloudLogin()}});
  const{data:{session}}=await sb.auth.getSession();
  if(recovering)return;
  if(!session){renderCloudLogin();return}
  enterShop();
}

/* ================== Arranque ================== */
["gesturestart","gesturechange"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h))view=h}
document.documentElement.lang=S.settings.lang;applyTheme();
if(DEMO){purgeTrash();render();idbOpen().then(idbAll).then(()=>{if(ME)render()})}
else idbOpen().then(idbAll).then(bootCloud);
</script>
