<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ColorBay · Administrador</title>
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="icons/admin-apple.png">
<link rel="icon" type="image/png" href="icons/admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CB Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2347">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js?v=20261112c"></script>
<style>
/* Panel solo para Dakra Studio: lista de talleres con plan, estado y acciones */
:root{--navy:#0c2347;--bay:#1456b8;--paint:#e8541c;--tape:#e9d9a8;--ok:#1f8a4c;--bad:#c2352b;--warn:#b7791f;
  --bg:#eef0f1;--surface:#fff;--surface-2:#f5f7f9;--ink:#16202a;--muted:#5d6b78;--line:#d9dfe5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--surface:#171e26;--surface-2:#1d2630;--ink:#e8edf2;--muted:#93a1ae;--line:#2a3542;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--surface:#171e26;--surface-2:#1d2630;--ink:#e8edf2;--muted:#93a1ae;--line:#2a3542;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1}
.bar{background:var(--navy);color:#fff}
.bar .w{display:flex;justify-content:space-between;align-items:center;gap:12px;height:60px}
.w{width:min(1100px,100% - 32px);margin-inline:auto}
.tape{display:inline-block;background:var(--tape);color:#3d3420;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:4px 12px;transform:rotate(-2deg)}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn-pri{background:var(--bay);color:#fff}.btn-paint{background:var(--paint);color:#fff}
.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.btn-sm{padding:6px 10px;font-size:14px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.login{max-width:400px;margin:60px auto;padding:24px;display:flex;flex-direction:column;gap:12px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;font-size:16px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}
.stat{padding:14px}.stat b{display:block;font-family:var(--display);font-size:34px}.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{max-width:280px}
.shop{padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1.2fr 1fr;gap:16px;border-left:5px solid var(--c,var(--line))}
.shop h3{font-size:26px}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.acts{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px;display:block;font-size:13px;white-space:pre-wrap;word-break:break-all}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}.shop{grid-template-columns:1fr}.form{grid-template-columns:1fr}}

/* iPhone: las fechas no deben salirse del cuadro */
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
/* Pestañas y promotores */
.tabs{display:flex;gap:6px;margin:18px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;font:inherit;font-weight:600;padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--navy);color:#fff}
.promo{padding:16px;margin-bottom:12px;border-left:5px solid var(--c,var(--paint))}
.promo h3{font-size:26px}
.linkbox{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.linkbox input{flex:1;min-width:200px;font-size:14px;background:var(--surface-2)}
.rows{margin-top:10px;border-top:1px solid var(--line)}
.rows>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px;flex-wrap:wrap}
.money{font-family:var(--display);font-size:22px;font-weight:700}
.payrow{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.payrow input{width:110px}
.stats.s4{grid-template-columns:repeat(4,1fr)}
.todo{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-bottom:10px;border-left:5px solid var(--c,var(--line))}
.todo .ic{font-size:26px;flex:none;width:34px;text-align:center}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-size:17px}.todo .tx span{font-size:14px;color:var(--muted)}
.todo .ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.todo .ac a{text-decoration:none}
.done{padding:30px 16px;text-align:center;color:var(--muted)}
.done b{display:block;font-family:var(--display);font-size:30px;color:var(--ok);margin-bottom:4px}
@media (max-width:760px){.todo{flex-wrap:wrap}.todo .ac{width:100%;justify-content:stretch}.todo .ac>*{flex:1;text-align:center}}
@media (max-width:760px){.stats.s4{grid-template-columns:repeat(2,1fr)}}
.form>*{min-width:0}
</style>
</head>
<body>
<header class="bar"><div class="w"><b style="font-family:var(--display);font-size:22px">ColorBay · Administrador</b><span id="who" style="font-size:14px;opacity:.85"></span></div></header>
<main class="w" id="main"></main>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CFG=window.COLORBAY_CONFIG||{};let ENDING=null;
let sb=null,SHOPS=[],q="",fil="all",TAB="pend",PROMOS=[],COMMS=[],PAYS=[],PROMO_ERR="",EDIT=null;
const PRICE={solo:35,shop:69,plus:99};
const AGREEMENT_V="2026-11-13";   /* misma versión que promotor.html */
const portalLink=p=>location.href.replace(/admin\.html.*$/,"")+"promotor.html?t="+p.accept_token;
const needsAccept=p=>p.mode!=="credit"&&!p.ended_at&&p.accepted_version!==AGREEMENT_V;
const payableOf=p=>COMMS.filter(c=>c.promoter_id===p.id&&c.status==="owed"&&c.kind!=="credit"&&(c.kind==="clawback"||Date.now()-Date.parse(c.created_at)>=30*864e5));
const priceOf=s=>s.plan==="founder"?29:(PRICE[s.tier]||69);
const money=n=>"$"+Number(n||0).toFixed(2);
const PLAN={trial:"Prueba gratis",paid:"Pagando",founder:"Fundador",courtesy:"Cortesía"};
const PC={trial:"#b7791f",paid:"#1f8a4c",founder:"#1456b8",courtesy:"#8e6bd8"};
const TIER={solo:"Solo · 1 persona",shop:"Taller · hasta 5",plus:"Plus · sin límite"};
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2200)}
const fmt=d=>d?new Date(d).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}):"—";
const daysLeft=d=>Math.ceil((new Date(d)-new Date())/864e5);
function loadScript(src){return new Promise((r,j)=>{const s=document.createElement("script");s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)})}

function loginView(msg=""){
  $("#who").textContent="";
  $("#main").innerHTML=`<form class="card login" id="lf"><span class="tape">Solo Dakra Studio</span><h1 style="font-size:34px">Entrar</h1>
   <label>Correo<input id="e" type="email" autocomplete="email" required></label><label>Contraseña<input id="p" type="password" autocomplete="current-password" minlength="6" required></label>
   <div class="err">${esc(msg)}</div><button class="btn btn-pri">Entrar</button>
   <button type="button" class="btn btn-ghost" id="su">Crear mi cuenta de administrador</button></form>`;
  $("#lf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.signInWithPassword({email:$("#e").value.trim(),password:$("#p").value});if(error)return loginView("Correo o contraseña incorrectos.");load()};
  $("#su").onclick=async()=>{const em=$("#e").value.trim(),pw=$("#p").value;if(!em||pw.length<6)return loginView("Escribe tu correo y una contraseña de al menos 6 letras.");
    const{data,error}=await sb.auth.signUp({email:em,password:pw});if(error)return loginView(error.message);
    if(!data.session)return loginView("Cuenta creada. Si Supabase pide confirmar el correo, confírmalo y luego entra.");load()};
}
function notAdmin(email){
  $("#main").innerHTML=`<div class="card login"><h1 style="font-size:30px">Falta un paso</h1><p>La cuenta <b>${esc(email)}</b> todavía no es administradora. En Supabase abre <b>SQL Editor</b>, pega esto y toca <b>Run</b>:</p>
   <code>insert into public.platform_admins(user_id) select id from auth.users where email = '${esc(email)}';</code>
   <button class="btn btn-pri" onclick="load()">Ya lo hice, recargar</button><button class="btn btn-ghost" onclick="logout()">Salir</button></div>`;
}
async function logout(){await sb.auth.signOut();loginView()}
async function load(){
  const{data:{user}}=await sb.auth.getUser();if(!user)return loginView();
  $("#who").innerHTML=`${esc(user.email)} · <a href="#" style="color:#fff" onclick="logout();return false">Salir</a>`;
  const{data:isA}=await sb.rpc("is_admin");if(!isA)return notAdmin(user.email);
  const{data,error}=await sb.rpc("admin_shops");if(error){$("#main").innerHTML=`<p class="err">Error: ${esc(error.message)}</p>`;return}
  SHOPS=data||[];
  const[p,c,y]=await Promise.all([sb.from("promoters").select("*").order("created_at"),sb.from("commissions").select("*").order("created_at"),sb.from("payments").select("id,shop_id,amount,paid_at,source,note,refunded_at").order("paid_at")]);
  PROMO_ERR=p.error||c.error||y.error?"Para usar promotores, vuelve a correr supabase/schema.sql en el SQL Editor.":"";
  PROMOS=p.data||[];COMMS=c.data||[];PAYS=y.data||[];render();
}
function render(){
  const nP=PROMO_ERR?0:pendings().length;
  const tabs=`<div class="tabs"><button class="${TAB==="pend"?"on":""}" data-tab="pend">Pendientes${nP?` <span class="chip" style="background:var(--paint);color:#fff;border:0">${nP}</span>`:" ✓"}</button><button class="${TAB==="shops"?"on":""}" data-tab="shops">Talleres</button><button class="${TAB==="promo"?"on":""}" data-tab="promo">Promotores${COMMS.some(c=>c.status==="owed"&&c.kind!=="credit")?` · <span style="color:var(--paint)">${money(COMMS.filter(c=>c.status==="owed"&&c.kind!=="credit").reduce((a,c)=>a+ +c.amount,0))}</span>`:""}</button></div>`;
  if(TAB==="promo")renderPromos(tabs);else if(TAB==="pend")renderPend(tabs);else renderShops(tabs);
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;EDIT=null;render()});
}
function renderShops(tabs){
  const n=k=>SHOPS.filter(k).length;
  const open=s=>s.status==="active"&&(s.plan!=="trial"||daysLeft(s.trial_ends)>0);
  const list=SHOPS.filter(s=>(fil==="all"||s.plan===fil||(fil==="suspended"&&!open(s)))&&[s.name,s.owner_email,s.phone,s.join_code].join(" ").toLowerCase().includes(q.toLowerCase()));
  $("#main").innerHTML=`${tabs}<div class="stats">
    <div class="card stat"><b>${SHOPS.length}</b><span>Talleres</span></div>
    <div class="card stat"><b style="color:var(--ok)">${n(s=>s.plan==="paid"||s.plan==="founder")}</b><span>Pagando</span></div>
    <div class="card stat"><b style="color:var(--warn)">${n(s=>s.plan==="trial"&&open(s))}</b><span>En prueba</span></div>
    <div class="card stat"><b style="color:#8e6bd8">${n(s=>s.plan==="courtesy")}</b><span>Cortesía</span></div>
    <div class="card stat"><b style="color:var(--bad)">${n(s=>!open(s))}</b><span>Pausados o vencidos</span></div></div>
   <div class="toolbar"><input id="q" placeholder="Buscar taller, correo o código" value="${esc(q)}">
    <select id="fil" style="width:auto">${[["all","Todos"],["trial","Prueba"],["paid","Pagando"],["founder","Fundador"],["courtesy","Cortesía"],["suspended","Pausados o vencidos"]].map(([k,v])=>`<option value="${k}" ${fil===k?"selected":""}>${v}</option>`).join("")}</select>
    <button class="btn btn-ghost" onclick="load()">Actualizar</button></div>
   ${list.map(s=>{const o=open(s);return`<div class="card shop" style="--c:${o?PC[s.plan]:"var(--bad)"}" data-id="${s.id}">
     <div><h3>${esc(s.name)}</h3><div class="meta"><span>${esc(s.owner_email||"")}</span>${s.phone?`<span>${esc(s.phone)}</span>`:""}<span>Código <b>${esc(s.join_code)}</b></span></div>
      <div class="meta"><span class="chip" style="color:${PC[s.plan]}">${PLAN[s.plan]}</span><span class="chip">${(TIER[s.tier]||TIER.shop).split(" · ")[0]}</span><span class="chip" style="color:${o?"var(--ok)":"var(--bad)"}">${o?"Activo":s.status==="suspended"?"Suspendido":"Prueba vencida"}</span>
       ${s.plan==="trial"?`<span>${daysLeft(s.trial_ends)>0?daysLeft(s.trial_ends)+" días de prueba":"venció el "+fmt(s.trial_ends)}</span>`:""}
       ${s.paid_until?`<span>Stripe: pagado hasta ${fmt(s.paid_until)}</span>`:""}
       <span style="color:${s.terms_at?"var(--ok)":"var(--muted)"}">${s.terms_at?"Términos aceptados "+fmt(s.terms_at):"Términos aún sin aceptar"}</span></div>
      <div class="meta"><span>${s.orders} órdenes</span><span>${s.workers} personas</span><span>Último uso: ${fmt(s.last_activity)}</span><span>Alta: ${fmt(s.created_at)}</span></div></div>
     <div class="form">
      <label>Plan<select data-k="plan">${Object.entries(PLAN).map(([k,v])=>`<option value="${k}" ${s.plan===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label>Nivel<select data-k="tier">${Object.entries(TIER).map(([k,v])=>`<option value="${k}" ${(s.tier||"shop")===k?"selected":""}>${v}</option>`).join("")}</select></label>
      <label>Estado<select data-k="status"><option value="active" ${s.status==="active"?"selected":""}>Activo</option><option value="suspended" ${s.status==="suspended"?"selected":""}>Suspendido</option></select></label>
      <label class="full">Fin de la prueba<input type="date" data-k="trial_ends" value="${(s.trial_ends||"").slice(0,10)}"></label>
      <label class="full">Notas privadas<input data-k="notes" value="${esc(s.notes||"")}" placeholder="Ej. compañero, gratis de por vida"></label>
      <label class="full">Lo recomendó<select data-k="ref"><option value="">— Nadie —</option>${PROMOS.map(p=>`<option value="${esc(p.code)}" ${s.ref_code===p.code?"selected":""}>${esc(p.name)} · ${esc(p.code)}</option>`).join("")}${s.ref_code&&!PROMOS.some(p=>p.code===s.ref_code)?`<option selected value="${esc(s.ref_code)}">${esc(s.ref_code)}</option>`:""}</select></label>
      ${PROMO_ERR?"":(()=>{const ps=PAYS.filter(x=>x.shop_id===s.id&&!x.refunded_at);const all=PAYS.filter(x=>x.shop_id===s.id);return`<div class="full" style="font-size:14px;color:var(--muted)">Pagos recibidos: <b style="color:var(--ink)">${ps.length} · ${money(ps.reduce((a,x)=>a+ +x.amount,0))}</b>${ps.length?` · último ${fmt(ps[ps.length-1].paid_at)}`:""}
        ${all.length?`<details style="margin-top:6px"><summary style="cursor:pointer">Ver pagos</summary>${all.slice().reverse().slice(0,12).map(x=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><span>${fmt(x.paid_at)} · ${x.source==="stripe"?"Stripe":"a mano"}</span><span>${x.refunded_at?`<s>${money(x.amount)}</s> reembolsado`:`<b style="color:var(--ink)">${money(x.amount)}</b> <button class="btn btn-ghost btn-sm" data-refund="${x.id}" type="button">Reembolsado</button>`}</span></div>`).join("")}</details>`:""}
        <div class="payrow"><input type="number" inputmode="decimal" step="any" min="0" data-amt value="${priceOf(s)}" aria-label="Cantidad"><button class="btn btn-ghost btn-sm" data-addpay>Registrar pago recibido</button></div></div>`})()}
      <div class="acts"><button class="btn btn-ghost btn-sm" data-exp>Descargar sus datos</button><button class="btn btn-pri btn-sm" data-save>Guardar</button></div></div></div>`}).join("")||`<p style="color:var(--muted)">No hay talleres con ese filtro.</p>`}`;
  $("#q").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();$("#q").focus();$("#q").setSelectionRange(p,p)};
  $("#fil").onchange=e=>{fil=e.target.value;render()};
  document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const c=b.closest(".shop"),v=k=>c.querySelector(`[data-k="${k}"]`).value;
    const te=v("trial_ends");const sh=SHOPS.find(x=>x.id===c.dataset.id);
    if(!PROMO_ERR&&(sh.ref_code||"")!==v("ref")){const r=await sb.rpc("admin_set_ref",{p_shop:c.dataset.id,p_code:v("ref")});if(r.error){toast("Error: "+r.error.message);return}}
    const{error}=await sb.rpc("admin_update_shop",{p_shop:c.dataset.id,p_plan:v("plan"),p_status:v("status"),p_trial_ends:te?new Date(te+"T23:59:00").toISOString():null,p_notes:v("notes"),p_tier:v("tier")});
    if(error){toast("Error: "+error.message);return}toast("Guardado");load()});
  document.querySelectorAll("[data-refund]").forEach(b=>b.onclick=async()=>{if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="¿Seguro? Toca otra vez";return}
    b.disabled=true;const{error}=await sb.rpc("admin_refund_payment",{p_id:+b.dataset.refund});if(error){toast("Error: "+error.message);return}toast("Marcado como reembolsado; su comisión se ajustó sola");load()});
  document.querySelectorAll("[data-addpay]").forEach(b=>b.onclick=async()=>{const c=b.closest(".shop"),amt=parseFloat(c.querySelector("[data-amt]").value);
    if(!(amt>0)){toast("Escribe la cantidad");return}b.disabled=true;
    const{error}=await sb.from("payments").insert({shop_id:c.dataset.id,amount:amt,source:"manual"});
    if(error){toast("Error: "+error.message);b.disabled=false;return}toast("Pago registrado");load()});
  document.querySelectorAll("[data-exp]").forEach(b=>b.onclick=async()=>{const id=b.closest(".shop").dataset.id;const{data,error}=await sb.rpc("admin_export",{p_shop:id});
    if(error){toast("Error: "+error.message);return}const s=SHOPS.find(x=>x.id===id);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download=`colorbay-${(s.name||"taller").replace(/\W+/g,"-")}.json`;a.click();toast("Datos descargados")});
}
/* ================== Pendientes: todo lo que hay que hacer, en un solo lugar ================== */
const shopName=id=>SHOPS.find(s=>s.id===id)?.name||"Taller";
const lastPay=id=>{const ps=PAYS.filter(x=>x.shop_id===id);return ps.length?ps[ps.length-1]:null};
const MSG={
  welcome:s=>`Hi! This is Dakra Studio from ColorBay Shop. Thanks for signing up ${s.name}! If you need any help setting up your shop or your team, just text me here.`,
  ending:s=>`Hi! Quick reminder from ColorBay Shop: ${s.name}'s free trial ends in ${daysLeft(s.trial_ends)} day${daysLeft(s.trial_ends)==1?"":"s"}. To keep everything running, open the app and go to Settings → Plan. Your data stays safe either way. Any questions, just reply here.`,
  expired:s=>`Hi! ${s.name}'s ColorBay Shop trial has ended. Your data is saved and nothing was deleted. If you'd like to keep using it, reply here and I'll help you get set up.`,
  late:s=>`Hi! Your ColorBay Shop payment didn't go through. You still have a few days before the account pauses. You can update your card in the app: Settings → Plan → View or cancel my subscription. Your data is safe.`,

function pendings(){
  const L=[],now=Date.now();
  PROMOS.forEach(p=>{const ow=payableOf(p);if(!ow.length)return;const t=ow.reduce((a,c)=>a+ +c.amount,0);if(t<25&&!(p.ended_at&&t>0))return;
    L.push({pri:1,c:"var(--paint)",ic:"💵",t:`Págale ${money(t)} a ${p.name} (a más tardar el 15)`,s:`${ow.length} movimiento${ow.length==1?"":"s"} con 30 días o más · ${p.payout?"Pagarle por: "+p.payout:"No anotó cómo pagarle"}${p.w9_received?"":" · ⚠️ Primero pídele su W-9 (en Promotores, márcalo cuando lo tengas)"}`,a:`<button class="btn btn-pri btn-sm" data-paypromo="${p.id}">Ya le pagué</button>`})});
  PROMOS.filter(needsAccept).forEach(p=>{const ph=(p.phone||"").replace(/[^\d+]/g,""),url=portalLink(p),txt=`Hola ${p.name.split(" ")[0]}! / Hi! Aquí está tu página de promotor de ColorBay / Here's your ColorBay partner page: ${url}`;
    L.push({pri:2,c:"var(--warn)",ic:"✍️",t:`${p.name} todavía no firma su acuerdo`,s:"Su código no funciona hasta que lo firme. Mándale su página.",
      a:`${ph?`<a class="btn btn-ghost btn-sm" href="sms:${esc(ph)}${/iPhone|iPad|iPod|Mac/.test(navigator.userAgent)?"&":"?"}body=${encodeURIComponent(txt)}">💬 Mandar mensaje</a>`:""}${p.email?`<a class="btn btn-ghost btn-sm" href="mailto:${esc(p.email)}?subject=${encodeURIComponent("ColorBay partner agreement")}&body=${encodeURIComponent(txt)}">✉️ Mandar correo</a>`:""}<button class="btn btn-ghost btn-sm" data-cp="${esc(url)}">Copiar su página</button>`})});
  const y=new Date().getFullYear()-1,k1099="cb-1099-"+y;let done={};try{done=JSON.parse(localStorage.getItem(k1099)||"{}")}catch(e){}
  if(new Date().getMonth()===0)PROMOS.forEach(p=>{const tot=COMMS.filter(c=>c.promoter_id===p.id&&c.status==="paid"&&c.kind!=="credit"&&c.paid_at&&new Date(c.paid_at).getFullYear()===y).reduce((a,c)=>a+ +c.amount,0);
    if(tot>=2000&&!done[p.id])L.push({pri:1,c:"var(--bad)",ic:"📄",t:`Mándale el 1099-NEC a ${p.name} antes del 31 de enero`,s:`En ${y} le pagaste ${money(tot)}. ${p.w9_received?"Ya tienes su W-9.":"⚠️ No tienes su W-9."} Pregúntale a quien te hace los impuestos.`,a:`<button class="btn btn-pri btn-sm" data-1099="${p.id}">Ya lo mandé</button>`})});
  COMMS.filter(c=>c.kind==="credit"&&c.status==="owed").forEach(c=>{const p=PROMOS.find(x=>x.id===c.promoter_id),rs=SHOPS.find(s=>s.id===p?.shop_id);
    L.push({pri:1,c:"var(--bay)",ic:"🎁",t:`Mes gratis para ${rs?.name||p?.name||"un taller"}`,s:rs?.stripe_customer?`Recomendó a ${shopName(c.shop_id)}. Stripe lo aplica solo en su siguiente cobro.`:`Recomendó a ${shopName(c.shop_id)}. No le cobres su siguiente mes.`,
      a:rs?.stripe_customer?"":`<button class="btn btn-pri btn-sm" data-credit="${c.id}">Listo, no se lo cobré</button>`})});
  SHOPS.filter(s=>s.status==="active"&&(s.plan==="paid"||s.plan==="founder")&&!s.stripe_sub).forEach(s=>{const lp=lastPay(s.id),since=lp?Date.parse(lp.paid_at):Date.parse(s.created_at);
    if(now-since>31*864e5)L.push({pri:1,c:"var(--warn)",ic:"🧾",t:`Cóbrale a ${s.name}: ${money(priceOf(s))}`,s:lp?`Último pago: ${fmt(lp.paid_at)} (paga a mano)`:"Todavía no tiene pagos registrados (paga a mano)",
      a:`${smsBtn(s,"charge")}<button class="btn btn-pri btn-sm" data-gotpay="${s.id}">Ya me pagó ${money(priceOf(s))}</button>`})});
  SHOPS.filter(s=>(s.plan==="paid"||s.plan==="founder")&&s.paid_until&&Date.parse(s.paid_until)<now).forEach(s=>{const d=7-Math.floor((now-Date.parse(s.paid_until))/864e5);
    L.push({pri:1,c:"var(--bad)",ic:"⚠️",t:`Pago atrasado: ${s.name}`,s:d>0?`Stripe no pudo cobrar. Se pausa en ${d} día${d==1?"":"s"} si no paga.`:"Ya se pausó por falta de pago (sus datos siguen guardados).",a:smsBtn(s,"late")})});
  SHOPS.filter(s=>!s.admin_seen_at).forEach(s=>L.push({pri:2,c:"var(--ok)",ic:"🆕",t:`Taller nuevo: ${s.name}`,s:[s.owner_email,s.phone,s.ref_code?"lo recomendó "+s.ref_code:"llegó solo","alta "+fmt(s.created_at)].filter(Boolean).join(" · "),
    a:`${smsBtn(s,"welcome")}<button class="btn btn-pri btn-sm" data-seen="${s.id}">Visto</button>`}));
  SHOPS.filter(s=>s.plan==="trial"&&s.status==="active").forEach(s=>{const d=daysLeft(s.trial_ends);
    if(d>0&&d<=7)L.push({pri:3,c:"var(--warn)",ic:"⏳",t:`A ${s.name} se le acaba la prueba en ${d} día${d==1?"":"s"}`,s:"Buen momento para escribirle y ayudarle a quedarse.",a:smsBtn(s,"ending")});
    else if(d<=0&&d>-15)L.push({pri:3,c:"var(--bad)",ic:"⌛",t:`Se le venció la prueba a ${s.name}`,s:`Venció el ${fmt(s.trial_ends)}. Sus datos siguen guardados.`,a:smsBtn(s,"expired")})});
  return L.sort((x,y)=>x.pri-y.pri);
}
function renderPend(tabs){
  const L=PROMO_ERR?[]:pendings();
  $("#main").innerHTML=`${tabs}<div style="margin:18px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="font-size:30px">${L.length?`Tienes ${L.length} pendiente${L.length==1?"":"s"}`:"Todo al día"}</h2><button class="btn btn-ghost btn-sm" onclick="load()">Actualizar</button></div>
   ${PROMO_ERR?`<div class="card" style="padding:16px;color:var(--bad)">${PROMO_ERR}</div>`:L.length?L.map(x=>`<div class="card todo" style="--c:${x.c}"><div class="ic">${x.ic}</div><div class="tx"><b>${esc(x.t)}</b><span>${esc(x.s)}</span></div><div class="ac">${x.a}</div></div>`).join("")
   :`<div class="card done"><b>✓ Todo al día</b>No hay nada pendiente. Aquí te aparece solo cuando entre un taller nuevo, haya que pagarle a un promotor, aplicar un mes gratis, cobrar o avisar que se acaba una prueba.</div>`}`;
  const go=async(p)=>{const r=await p;if(r.error){toast("Error: "+r.error.message);return false}return true};
  document.querySelectorAll("[data-seen]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await go(sb.rpc("admin_seen",{p_shop:b.dataset.seen}))){toast("Listo");load()}});
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp));
  document.querySelectorAll("[data-1099]").forEach(b=>b.onclick=()=>{const k="cb-1099-"+(new Date().getFullYear()-1);let d={};try{d=JSON.parse(localStorage.getItem(k)||"{}")}catch(e){}d[b.dataset["1099"]]=1;try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}render()});
  document.querySelectorAll("[data-paypromo]").forEach(b=>b.onclick=async()=>{b.disabled=true;const ids=payableOf(PROMOS.find(p=>p.id===b.dataset.paypromo)).map(c=>c.id);
    if(await go(sb.from("commissions").update({status:"paid",paid_at:new Date().toISOString()}).in("id",ids))){toast("Marcado como pagado");load()}});
  document.querySelectorAll("[data-credit]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await go(sb.rpc("admin_apply_credit",{p_id:+b.dataset.credit}))){toast("Mes gratis aplicado");load()}});
  document.querySelectorAll("[data-gotpay]").forEach(b=>b.onclick=async()=>{b.disabled=true;const s=SHOPS.find(x=>x.id===b.dataset.gotpay);
    if(await go(sb.from("payments").insert({shop_id:s.id,amount:priceOf(s),source:"manual"}))){toast("Pago registrado");load()}});
}

  if(PROMO_ERR)return;
  $("#np")&&($("#np").onclick=()=>{EDIT="new";render()});
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(b.dataset.cp));
  document.querySelectorAll("[data-sum]").forEach(b=>b.onclick=()=>copy(summaryMsg(PROMOS.find(p=>p.id===b.closest("[data-p]").dataset.p))));
  document.querySelectorAll("[data-w9]").forEach(b=>b.onchange=async()=>{const id=b.closest("[data-p]").dataset.p;const{error}=await sb.from("promoters").update({w9_received:b.checked}).eq("id",id);if(error){toast("Error: "+error.message);return}toast(b.checked?"W-9 anotado":"W-9 quitado");load()});
  document.querySelectorAll("[data-end]").forEach(b=>b.onclick=()=>{ENDING=b.closest("[data-p]").dataset.p;render()});
  document.querySelectorAll("[data-endx]").forEach(b=>b.onclick=()=>{ENDING=null;render()});
  document.querySelectorAll("[data-endgo]").forEach(b=>b.onclick=async()=>{const id=b.closest("[data-p]").dataset.p;b.disabled=true;
    const{error}=await sb.from("promoters").update({active:false,ended_at:new Date().toISOString(),end_type:$("#end-type").value,end_reason:$("#end-reason").value.trim()||null}).eq("id",id);
    if(error){toast("Error: "+error.message);b.disabled=false;return}ENDING=null;toast("Relación terminada. Copia el aviso y mándaselo.");load()});
  document.querySelectorAll("[data-endmsg]").forEach(b=>b.onclick=()=>copy(endMsg(PROMOS.find(p=>p.id===b.closest("[data-p]").dataset.p),b.dataset.endmsg)));
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{EDIT=b.closest("[data-p]").dataset.p;render();scrollTo({top:0,behavior:"smooth"})});
  const markPaid=async ids=>{const{error}=await sb.from("commissions").update({status:"paid",paid_at:new Date().toISOString()}).in("id",ids);if(error){toast("Error: "+error.message);return}toast("Marcado como pagado");load()};
  document.querySelectorAll("[data-paid]").forEach(b=>b.onclick=()=>{b.disabled=true;markPaid([+b.dataset.paid])});
  document.querySelectorAll("[data-paidall]").forEach(b=>b.onclick=()=>{b.disabled=true;const id=b.closest("[data-p]").dataset.p;markPaid(COMMS.filter(c=>c.promoter_id===id&&c.status==="owed").map(c=>c.id))});
  const f=$("#pf");if(!f)return;
  const sync=()=>{const m=f.mode.value;$("#amtL").textContent=m==="flat"?"Cuánto le pagas por taller ($)":"Porcentaje de cada pago (%)";$("#apL").hidden=m==="recurring";$("#moL").hidden=m!=="recurring";$("#amL").hidden=m==="credit";$("#shL").hidden=m!=="credit"};
  f.mode.onchange=()=>{if(f.mode.value==="recurring"&&+f.amount.value===50)f.amount.value=25;if(f.mode.value==="flat"&&+f.amount.value===25)f.amount.value=50;sync()};
  f.name.oninput=()=>{if(!f.code.readOnly&&!f.code.dataset.touched)f.code.value=(f.name.value.split(" ")[0]||"").normalize("NFD").replace(/[^A-Za-z0-9]/g,"").toUpperCase().slice(0,12)+(f.name.value.trim()?String(new Date().getFullYear()).slice(2):"")};
  f.code.oninput=()=>{f.code.dataset.touched=1;f.code.value=f.code.value.toUpperCase().replace(/[^A-Z0-9]/g,"")};
  $("#pf-x").onclick=()=>{EDIT=null;render()};
  f.onsubmit=async e=>{e.preventDefault();const err=$("#pf-err");const row={name:f.name.value.trim(),code:f.code.value.trim().toUpperCase(),phone:f.phone.value.trim()||null,email:f.email.value.trim()||null,payout:f.payout.value.trim()||null,
      mode:f.mode.value,amount:+f.amount.value||0,after_payments:Math.max(1,+f.after_payments.value||1),months:Math.max(1,+f.months.value||1),bonus_days:Math.max(0,+f.bonus_days.value||0),active:f.active.value==="1",notes:f.notes.value.trim()||null,shop_id:f.mode.value==="credit"?(f.shop_id.value||null):null};
    if(row.mode==="credit"){row.amount=1;if(!row.shop_id){err.textContent="Escoge qué taller cliente es.";return}}
    if(!row.name){err.textContent="Escribe el nombre.";return}if(!/^[A-Z0-9]{3,20}$/.test(row.code)){err.textContent="El código debe tener de 3 a 20 letras o números, sin espacios.";return}
    const r=EDIT==="new"?await sb.from("promoters").insert(row):await sb.from("promoters").update(row).eq("id",EDIT);
    if(r.error){err.textContent=/duplicate|unique/i.test(r.error.message)?"Ese código ya lo tiene otro promotor.":"Error: "+r.error.message;return}
    EDIT=null;toast("Promotor guardado");load()};
}

(async()=>{
  if(!CFG.url||!CFG.key){$("#main").innerHTML=`<div class="card login"><h1 style="font-size:30px">Falta conectar la nube</h1><p>Primero hay que poner la dirección y la llave de Supabase en <b>config.js</b>.</p></div>`;return}
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js")}catch(e){await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js")}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{storageKey:"colorbay-admin-auth",persistSession:true,autoRefreshToken:true}});load();
})();
</script>
</body>
</html>
