<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>ColorBay Partner</title>
<link rel="icon" type="image/png" href="icons/app-192.png">
<link rel="apple-touch-icon" href="icons/app-apple.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="config.js?v=20261113a"></script>
<style>
:root{--navy:#0c2347;--bay:#1456b8;--paint:#e8541c;--tape:#e9d9a8;--ok:#1f8a4c;--bad:#c2352b;--warn:#b7791f;
  --bg:#eef0f1;--surface:#fff;--surface-2:#f5f7f9;--ink:#16202a;--muted:#5d6b78;--line:#d9dfe5;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1419;--surface:#171e26;--surface-2:#1d2630;--ink:#e8edf2;--muted:#93a1ae;--line:#2a3542;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.nav{background:var(--navy);color:#fff;position:sticky;top:0;z-index:5}
.nav .in{width:min(820px,100% - 32px);margin:auto;height:58px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:21px}
.logo img{width:28px;height:28px;border-radius:7px}
.lang{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
main{width:min(820px,100% - 32px);margin:24px auto 60px}
.tape{display:inline-block;background:var(--tape);color:#3d3420;font-family:var(--display);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;padding:4px 14px;transform:rotate(-1.5deg)}
h1{font-family:var(--display);font-size:clamp(36px,8vw,52px);line-height:.95;margin:12px 0 8px}
h2{font-family:var(--display);font-size:30px;margin:0 0 8px;line-height:1}
h3{font-size:17px;margin:20px 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,30px);margin-bottom:18px}
.muted{color:var(--muted)}
.rule{background:color-mix(in srgb,var(--paint) 10%,var(--surface));border-left:5px solid var(--paint);border-radius:12px;padding:14px 16px;font-size:18px;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.tile{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile b{display:block;font-family:var(--display);font-size:30px;line-height:1.1}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:12px}
input{font:inherit;font-size:17px;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
label.agree{flex-direction:row;align-items:flex-start;gap:12px;text-transform:none;letter-spacing:0;font-size:16px;font-weight:500;color:var(--ink);line-height:1.4;cursor:pointer}
label.agree input{width:24px;height:24px;flex:none;margin:0;padding:0;accent-color:var(--paint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 20px;font:700 17px var(--body);cursor:pointer;text-decoration:none;touch-action:manipulation}
.btn-paint{background:var(--paint);color:#fff}.btn-ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.6}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.linkbox input{flex:1;min-width:220px;font-size:14px;background:var(--surface-2)}
.err{color:var(--bad);font-size:15px;min-height:1.2em;margin:10px 0}
.agreement{font-size:16px}
.agreement ol{padding-left:22px}.agreement li{margin:8px 0}
.banner{border-radius:14px;padding:14px 16px;margin-bottom:18px;font-weight:600}
.banner.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.banner.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad)}
details{margin-top:14px}summary{cursor:pointer;font-weight:700;color:var(--bay)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media print{.nav,.linkbox,.lang,#acc-form{display:none}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<header class="nav"><div class="in"><div class="logo"><img src="icons/app-192.png" alt="">ColorBay Partner</div><button class="lang" id="lang" type="button">ES</button></div></header>
<main id="main"><div class="card muted" id="loading">…</div></main>
<div class="toast" id="toast"></div>
<script>
/* Página del promotor: su acuerdo (para aceptarlo) y su portal con números. Se abre con su enlace privado ?t=... */
const AGREEMENT_V="2026-11-13";
const CFG=window.COLORBAY_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$"+Number(n||0).toFixed(2);
let lang="en",P=null,sb=null;
try{lang=localStorage.getItem("colorbay-web-lang")==="es"?"es":"en"}catch(e){}
if(/[?&]lang=es/.test(location.search))lang="es";
const token=new URLSearchParams(location.search).get("t")||"";
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2200)}
const fmt=d=>d?new Date(d).toLocaleDateString(lang==="es"?"es-MX":"en-US",{day:"numeric",month:"short",year:"numeric"}):"—";
const link=()=>location.href.replace(/promotor\.html.*$/,"")+"info.html?ref="+encodeURIComponent(P.code)+"#prueba";

function ruleText(p){
  const n=p.after_payments,m=p.months;
  if(lang==="es")return p.mode==="flat"?`Ganas ${money(p.amount)} por cada taller que se registre con tu código y llegue a ${n} pago${n==1?"":"s"} mensual${n==1?"":"es"}.`
    :p.mode==="recurring"?`Ganas el ${+p.amount}% de cada pago que haga cada taller que se registre con tu código, durante sus primeros ${m} pagos.`
    :`Ganas 1 mes gratis de ColorBay por cada taller que se registre con tu código y llegue a ${n} pagos.`;
  return p.mode==="flat"?`You earn ${money(p.amount)} for every shop that signs up with your code and reaches ${n} monthly payment${n==1?"":"s"}.`
    :p.mode==="recurring"?`You earn ${+p.amount}% of every payment made by each shop that signs up with your code, for their first ${m} payments.`
    :`You earn 1 free month of ColorBay for every shop that signs up with your code and reaches ${n} payments.`;
}

function agreementHtml(p){
  const R=ruleText(p),B=p.bonus_days;
  if(lang==="es")return`<div class="agreement">
  <p><b>Acuerdo de Promotor de ColorBay Shop</b> · Versión ${AGREEMENT_V}<br>Entre Dakra Studio, Tennessee, EE. UU. ("ColorBay", "nosotros") y la persona que lo acepta abajo ("tú").</p>
  <ol>
   <li><b>Qué eres.</b> Eres un promotor independiente, no empleado, socio ni representante de ColorBay. No puedes firmar ni prometer nada en nuestro nombre. No hay exclusividad, cuota ni horario: recomiendas cuando quieras. Debes tener 18 años o más.</li>
   <li><b>Lo que ganas.</b> ${esc(R)} El taller que use tu código gana ${B} días extra de prueba gratis.</li>
   <li><b>Cuándo cuenta un taller.</b> Cuenta si se registra con tu enlace o escribe tu código al registrarse o dentro de sus primeros 30 días. Si un taller usa el código de otra persona, gana el primer código que se usó; no se reparten comisiones. No cuentan: tu propio taller o uno que manejes (salvo que lo aprobemos por escrito), cuentas falsas o repetidas, cuentas gratis o de cortesía, ni pagos reembolsados o reclamados al banco.</li>
   <li><b>Cuándo te pagamos.</b> El día 15 de cada mes pagamos las comisiones que tengan 30 días o más, si suman $25 o más; si no, se suman al mes siguiente. Te pagamos por el medio que anotes (Zelle, Cash App, PayPal u otro). Si un taller recibe un reembolso después de que te pagamos, esa cantidad se descuenta de tus siguientes comisiones.</li>
   <li><b>Cómo debes promover.</b> Di solo la verdad sobre ColorBay y sus precios. No prometas descuentos, funciones ni "gratis para siempre" que no estén en nuestra página. No mandes mensajes masivos no deseados (spam), llamadas automáticas ni textos a quien no te dio permiso. No uses el nombre ColorBay en anuncios pagados sin nuestro permiso escrito, no digas que trabajas para ColorBay y nunca pidas contraseñas ni datos de un taller. Si lo publicas en redes, aclara que ganas una comisión.</li>
   <li><b>Impuestos.</b> Tú pagas tus propios impuestos. Antes de tu primer pago te pediremos el formulario W-9. Cuando la ley lo pida (hoy, si en un año te pagamos $2,000 o más), te mandaremos el formulario 1099-NEC.</li>
   <li><b>Lo que ves.</b> En esta página ves el nombre y el estado (en prueba, pagando o pausado) de los talleres que trajiste, y tus pagos. Nunca te damos otros datos de los talleres. No compartas esta información.</li>
   <li><b>Cambios.</b> Podemos cambiar las comisiones avisándote con 30 días de anticipación. El cambio solo aplica a talleres que se registren después; los que ya trajiste siguen con la regla que tenían.</li>
   <li><b>Terminar.</b> Tú o nosotros podemos terminar este acuerdo en cualquier momento, avisando por mensaje de texto o correo. Tu código deja de servir para registros nuevos.
     <br>• <b>Sin causa</b> (por ejemplo, si decides dejarlo, por bajo movimiento o si cambiamos el programa): te seguimos pagando por los talleres que ya trajiste, con tu regla, hasta que termine su periodo de comisión.
     <br>• <b>Con causa</b> (si rompes el punto 5, haces trampa o abusas del programa): termina de inmediato y ya no se generan comisiones nuevas. Te pagamos lo que ya habías ganado honestamente antes, menos lo que venga de la falta.
     <br>• Si cerramos el programa, te avisamos con 30 días y te pagamos todo lo ya ganado.</li>
   <li><b>Responsabilidad.</b> Tú cubres tus propios gastos. Eres responsable de cómo promueves y de cumplir las leyes al hacerlo. ColorBay no es responsable por pérdidas indirectas, y lo máximo que te podríamos deber por cualquier reclamo son las comisiones ganadas y no pagadas.</li>
   <li><b>Desacuerdos.</b> Primero lo platicamos. Este acuerdo se rige por las leyes de Tennessee, EE. UU.</li>
   <li><b>Aceptación.</b> Al escribir tu nombre y aceptar, firmas este acuerdo de forma electrónica, con la misma validez que una firma en papel. Guardamos la fecha, la versión y tu nombre. Este acuerdo, junto con la regla de arriba, es todo lo pactado entre nosotros.</li>
  </ol></div>`;
  return`<div class="agreement">
  <p><b>ColorBay Shop Partner Agreement</b> · Version ${AGREEMENT_V}<br>Between Dakra Studio, Tennessee, USA ("ColorBay", "we") and the person who accepts it below ("you").</p>
  <ol>
   <li><b>What you are.</b> You are an independent partner, not an employee, partner in the business, or agent of ColorBay. You can't sign or promise anything on our behalf. There is no exclusivity, quota or schedule: you refer whenever you want. You must be 18 or older.</li>
   <li><b>What you earn.</b> ${esc(R)} The shop that uses your code gets ${B} extra free trial days.</li>
   <li><b>When a shop counts.</b> A shop counts if it signs up with your link, or enters your code when signing up or within its first 30 days. If a shop uses someone else's code, the first code used wins; commissions are not split. These don't count: your own shop or one you manage (unless we approve it in writing), fake or duplicate accounts, free or courtesy accounts, and refunded or charged-back payments.</li>
   <li><b>When we pay you.</b> On the 15th of each month we pay commissions that are at least 30 days old, if they add up to $25 or more; otherwise they roll over to the next month. We pay through the method you give us (Zelle, Cash App, PayPal or other). If a shop gets a refund after we paid you, that amount is deducted from your next commissions.</li>
   <li><b>How to promote.</b> Only say true things about ColorBay and its prices. Don't promise discounts, features or "free forever" that aren't on our website. Don't send unwanted bulk messages (spam), robocalls, or texts to people who didn't give you permission. Don't use the ColorBay name in paid ads without our written OK, don't say you work for ColorBay, and never ask a shop for passwords or data. If you post about it publicly, say that you earn a commission.</li>
   <li><b>Taxes.</b> You pay your own taxes. Before your first payment we'll ask for a W-9 form. When the law requires it (currently, if we pay you $2,000 or more in a year), we'll send you a 1099-NEC.</li>
   <li><b>What you can see.</b> On this page you see the name and status (trial, paying or paused) of the shops you referred, and your payments. We never give you any other shop data. Don't share this information.</li>
   <li><b>Changes.</b> We may change commissions with 30 days' notice. Changes only apply to shops that sign up after the change; shops you already referred keep the rule they had.</li>
   <li><b>Ending.</b> You or we can end this agreement at any time by text or email. Your code then stops working for new signups.
     <br>• <b>Without cause</b> (for example, you decide to stop, low activity, or we change the program): we keep paying you for the shops you already referred, under your rule, until their commission period ends.
     <br>• <b>With cause</b> (you break section 5, cheat or abuse the program): it ends immediately and no new commissions are earned. We pay what you had honestly earned before, minus anything that came from the violation.
     <br>• If we close the program, we'll give you 30 days' notice and pay everything already earned.</li>
   <li><b>Responsibility.</b> You cover your own expenses. You're responsible for how you promote and for following the law while doing it. ColorBay isn't liable for indirect losses, and the most we could owe you for any claim is earned, unpaid commissions.</li>
   <li><b>Disagreements.</b> We talk first. This agreement is governed by the laws of Tennessee, USA.</li>
   <li><b>Acceptance.</b> By typing your name and agreeing, you sign this agreement electronically, with the same effect as a paper signature. We keep the date, version and your name. This agreement, with the rule above, is the entire deal between us.</li>
  </ol></div>`;
}
const T={en:{hi:"Hi",bad:"This link isn't valid. Ask Dakra Studio for your partner link.",net:"Can't connect right now. Try again in a moment.",
  readT:"Your partner agreement",readP:"Please read it. It's short and it explains exactly how you earn, when you get paid and how either of us can end it, so there are no surprises.",
  name:"Your full legal name (your signature)",email:"Email",payout:"How should we pay you? (Zelle, Cash App, PayPal…)",agree:"I've read and agree to the ColorBay Shop Partner Agreement.",
  go:"Sign and accept",needName:"Type your full name.",needAgree:"Check the box to accept.",signed:"Signed by",on:"on",
  yourLink:"Your link",copy:"Copy",share:"Share",yourCode:"Your code",rule:"Your rule",
  t1:"Shops referred",t2:"Paying",t3:"Pending",t4:"Paid to you",payNext:"Ready to pay on the 15th",shops:"Your shops",none:"No shops yet. Share your link to get started.",
  st:{trial:"Trial",paying:"Paying",paused:"Paused",other:"Active"},payouts:"Payments to you",viewAg:"View my agreement",print:"Print / save PDF",
  ended:"This partnership ended on",endedNo:"Your code no longer works for new signups.",endedSin:"You'll keep being paid for shops you already referred, under your rule.",
  newVer:"There's a new version of the agreement. Please review and accept it to keep your code active.",help:"Questions? Text +1 (931) 292-2496 or email dakrastudio@gmail.com",copied:"Copied",
  msg:"I use and recommend ColorBay Shop for body shops: orders, damage photos, estimates and invoices from your phone. Sign up with my link and get extra free days:"},
 es:{hi:"Hola",bad:"Este enlace no es válido. Pídele a Dakra Studio tu enlace de promotor.",net:"No hay conexión ahorita. Intenta en un momento.",
  readT:"Tu acuerdo de promotor",readP:"Léelo, por favor. Es corto y explica exactamente cómo ganas, cuándo te pagamos y cómo cualquiera de los dos puede terminarlo, para que no haya sorpresas.",
  name:"Tu nombre legal completo (tu firma)",email:"Correo",payout:"¿Cómo te pagamos? (Zelle, Cash App, PayPal…)",agree:"Leí y acepto el Acuerdo de Promotor de ColorBay Shop.",
  go:"Firmar y aceptar",needName:"Escribe tu nombre completo.",needAgree:"Marca la casilla para aceptar.",signed:"Firmado por",on:"el",
  yourLink:"Tu enlace",copy:"Copiar",share:"Compartir",yourCode:"Tu código",rule:"Tu regla",
  t1:"Talleres traídos",t2:"Pagando",t3:"Pendiente",t4:"Ya pagado",payNext:"Listo para pagarte el día 15",shops:"Tus talleres",none:"Todavía no hay talleres. Comparte tu enlace para empezar.",
  st:{trial:"En prueba",paying:"Pagando",paused:"Pausado",other:"Activo"},payouts:"Pagos que te hicimos",viewAg:"Ver mi acuerdo",print:"Imprimir / guardar PDF",
  ended:"Esta relación terminó el",endedNo:"Tu código ya no sirve para registros nuevos.",endedSin:"Te seguimos pagando por los talleres que ya trajiste, con tu regla.",
  newVer:"Hay una versión nueva del acuerdo. Revísala y acéptala para mantener tu código activo.",help:"¿Dudas? Mándanos mensaje al +1 (931) 292-2496 o escribe a dakrastudio@gmail.com",copied:"Copiado",
  msg:"Uso y recomiendo ColorBay Shop para talleres de hojalatería y pintura: órdenes, fotos de daños, estimados y facturas desde el celular. Regístrate con mi enlace y te dan días gratis extra:"}};
const t=k=>T[lang][k];

function render(){
  document.documentElement.lang=lang;$("#lang").textContent=lang==="en"?"ES":"EN";
  if(!P){$("#main").innerHTML=`<div class="card"><h2>ColorBay Partner</h2><p class="muted">${t(token?"bad":"bad")}</p><p class="muted">${t("help")}</p></div>`;return}
  const accepted=P.accepted_at&&P.accepted_version===AGREEMENT_V,first=(P.accepted_name||P.name||"").split(" ")[0];
  const ended=!!P.ended_at;
  let h=`<span class="tape">ColorBay Partner</span><h1>${t("hi")}, ${esc(first)}</h1>`;
  if(ended)h+=`<div class="banner bad">${t("ended")} ${fmt(P.ended_at)}. ${t("endedNo")} ${P.end_type==="sin_causa"?t("endedSin"):""}</div>`;
  if(!accepted){
    if(P.accepted_at)h+=`<div class="banner bad">${t("newVer")}</div>`;
    h+=`<div class="card"><h2>${t("readT")}</h2><p class="muted">${t("readP")}</p><div class="rule">${esc(ruleText(P))}</div>${agreementHtml(P)}
      <form id="acc-form" novalidate><label>${t("name")}<input id="a-name" autocomplete="name" value="${esc(P.accepted_name||"")}"></label>
      <label>${t("email")}<input id="a-email" type="email" autocomplete="email"></label>
      <label>${t("payout")}<input id="a-pay" value="${esc(P.payout||"")}"></label>
      <label class="agree" style="margin-top:16px"><input type="checkbox" id="a-ok"><span>${t("agree")}</span></label>
      <div class="err" id="a-err"></div><button class="btn btn-paint" style="width:100%">${t("go")}</button></form></div>`;
  }else{
    const sh=P.shops||[];
    h+=`<div class="card"><div class="rule">${esc(ruleText(P))}</div>
      ${ended?"":`<label>${t("yourLink")}</label><div class="linkbox"><input readonly id="lk" value="${esc(link())}"><button class="btn btn-ghost" id="cp">${t("copy")}</button><button class="btn btn-paint" id="sh">${t("share")}</button></div>
      <p class="muted" style="margin:10px 0 0">${t("yourCode")}: <b>${esc(P.code)}</b></p>`}
      <div class="tiles"><div class="tile"><b>${sh.length}</b><span>${t("t1")}</span></div><div class="tile"><b>${sh.filter(s=>s.status==="paying").length}</b><span>${t("t2")}</span></div>
       <div class="tile"><b style="color:var(--paint)">${P.mode==="credit"?"—":money(P.owed)}</b><span>${t("t3")}</span></div><div class="tile"><b style="color:var(--ok)">${P.mode==="credit"?"—":money(P.paid)}</b><span>${t("t4")}</span></div></div>
      ${P.mode!=="credit"&&+P.payable>=25?`<p style="margin:0;font-weight:700;color:var(--ok)">${t("payNext")}: ${money(P.payable)}</p>`:""}</div>
     <div class="card"><h2>${t("shops")}</h2>${sh.length?sh.map(s=>`<div class="row"><span>${esc(s.name)}</span><span><span class="chip">${t("st")[s.status]||s.status}</span> <span class="muted" style="font-size:14px">${fmt(s.since)}</span></span></div>`).join(""):`<p class="muted">${t("none")}</p>`}</div>
     ${(P.payouts||[]).length?`<div class="card"><h2>${t("payouts")}</h2>${P.payouts.map(x=>`<div class="row"><span>${fmt(x.date)}</span><b>${money(x.amount)}</b></div>`).join("")}</div>`:""}
     <div class="card"><p style="margin:0">${t("signed")} <b>${esc(P.accepted_name)}</b> ${t("on")} ${fmt(P.accepted_at)} · v${esc(P.accepted_version)}</p>
      <details><summary>${t("viewAg")}</summary>${agreementHtml(P)}<button class="btn btn-ghost" onclick="print()">${t("print")}</button></details></div>`;
  }
  h+=`<p class="muted" style="text-align:center;font-size:15px">${t("help")}</p>`;
  $("#main").innerHTML=h;
  const f=$("#acc-form");
  if(f)f.onsubmit=async e=>{e.preventDefault();const err=$("#a-err"),nm=$("#a-name").value.trim();
    if(nm.length<3||!/\s/.test(nm)){err.textContent=t("needName");return}if(!$("#a-ok").checked){err.textContent=t("needAgree");return}
    const b=f.querySelector("button");b.disabled=true;
    const{data,error}=await sb.rpc("promoter_accept",{p_token:token,p_name:nm,p_email:$("#a-email").value.trim(),p_payout:$("#a-pay").value.trim(),p_version:AGREEMENT_V,p_agent:navigator.userAgent.slice(0,300)});
    if(error||data!=="ok"){err.textContent=data==="name"?t("needName"):t("net");b.disabled=false;return}
    await load();scrollTo({top:0,behavior:"smooth"})};
  if($("#cp"))$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(link());toast(t("copied"))}catch(e){$("#lk").select();try{document.execCommand("copy");toast(t("copied"))}catch(e){}}};
  if($("#sh"))$("#sh").onclick=async()=>{if(navigator.share){try{await navigator.share({title:"ColorBay Shop",text:t("msg"),url:link()})}catch(e){}}else{try{await navigator.clipboard.writeText(t("msg")+" "+link());toast(t("copied"))}catch(e){}}};
}
$("#lang").onclick=()=>{lang=lang==="en"?"es":"en";try{localStorage.setItem("colorbay-web-lang",lang)}catch(e){}render()};
function loadScript(src){return new Promise((r,j)=>{const s=document.createElement("script");s.src=src;s.onload=r;s.onerror=j;document.head.appendChild(s)})}
async function load(){const{data,error}=await sb.rpc("promoter_portal",{p_token:token});if(error){$("#main").innerHTML=`<div class="card muted">${t("net")}</div>`;return}P=data;render()}
(async()=>{
  if(!CFG.url||!CFG.key||!/^[0-9a-f-]{36}$/i.test(token)){render();return}
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js")}catch(e){try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js")}catch(e){$("#main").innerHTML=`<div class="card muted">${t("net")}</div>`;return}}
  sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false,autoRefreshToken:false,storageKey:"colorbay-partner"}});load();
})();
</script>
</body>
