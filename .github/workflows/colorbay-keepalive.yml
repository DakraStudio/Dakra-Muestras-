# Mantiene despierta la base de datos de ColorBay (Supabase gratis se pausa tras 7 días sin uso).
# Corre cada 3 días y también se puede correr a mano desde la pestaña Actions.
name: ColorBay · mantener activa la nube
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Llamar a keep_alive
        run: |
          URL=$(grep -oE 'url: *"[^"]*"' colorbay/config.js | sed -E 's/url: *"([^"]*)"/\1/')
          KEY=$(grep -oE 'key: *"[^"]*"' colorbay/config.js | sed -E 's/key: *"([^"]*)"/\1/')
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "La nube todavía no está conectada (config.js vacío)."; exit 0; fi
          curl -fsS -X POST "$URL/rest/v1/rpc/keep_alive" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo; echo "Listo: la base de datos sigue activa."
