<title>Taller de Color</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: plano técnico. Héroe con titular ancho, escenario con camioneta en dibujo de línea que se "sumerge" en pintura + ticket de báscula impreso, riel de chips de color. Secciones que suben al hacer scroll, cinta de códigos que se desplaza. Software con la misma camioneta y asistente de preguntas flotante. */
@property --paint{syntax:'<color>';inherits:true;initial-value:#A0101E}
:root{
  --bg:#F2F2EE; --panel:#FFFFFF; --ink:#16181B; --muted:#62666D; --line:#DCDDD6; --soft:#F8F8F5;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --hi:#F4D35E; --hi-ink:#1C1A10;
  --ok:#1F7A44; --warn:#94620F; --bad:#B23A2E; --glass:#D8E0E4;
  --paint:#A0101E;
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101211; --panel:#191C1B; --ink:#EDEFEA; --muted:#A0A6A2; --line:#2B302E; --soft:#141716;
  --accent:#41C9AE; --accent-ink:#06221C; --hi:#E7C548; --hi-ink:#1C1A10;
  --ok:#5BCB8A; --warn:#E4AC4E; --bad:#F27B6E; --glass:#2A3438; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101211; --panel:#191C1B; --ink:#EDEFEA; --muted:#A0A6A2; --line:#2B302E; --soft:#141716;
  --accent:#41C9AE; --accent-ink:#06221C; --hi:#E7C548; --hi-ink:#1C1A10;
  --ok:#5BCB8A; --warn:#E4AC4E; --bad:#F27B6E; --glass:#2A3438; color-scheme:dark }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
code{font-size:.92em;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.muted{color:var(--muted)} .small{font-size:13px}
.kicker{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.kicker::before{content:"";width:18px;height:2px;background:var(--accent)}
mark{background:linear-gradient(transparent 58%,var(--hi) 58%,var(--hi) 92%,transparent 92%);color:inherit;padding:0 .06em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);transition:transform .15s,background .15s,color .15s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent);color:var(--accent-ink)}
.btn.big{padding:14px 26px;font-size:16px}
.btn.ghost{border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--line)}
.lang{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font:600 13px var(--f-mono);cursor:pointer;color:var(--ink)}
.lang:hover{border-color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
.pill{font:600 12px var(--f-mono);padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.n{color:var(--muted)}
.fin{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:var(--muted);border:1px solid var(--line);white-space:nowrap}

/* barra de avance al hacer scroll */
.progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:40;pointer-events:none}
.progress i{display:block;height:100%;width:100%;background:var(--paint);transform-origin:0 50%;transform:scaleX(var(--p,0))}

/* entradas al hacer scroll: siempre visibles, solo se acomodan */
.rise{transition:transform .8s cubic-bezier(.2,.75,.2,1),opacity .8s;transition-delay:var(--d,0ms)}
.js .rise.pre{transform:translateY(26px);opacity:.35}

/* ---------------- Camioneta (dibujo de línea) ---------------- */
.truck{width:100%;height:auto;display:block;overflow:visible}
.truck .ln{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.truck .thin{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.55}
.truck .win{fill:var(--glass);stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round}
.truck .tire{fill:#1A1C1F;stroke:var(--ink);stroke-width:2.2}
.truck .rim{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.truck .shine{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.33}
.truck .dim{stroke:var(--muted);stroke-width:1;fill:none}
.truck text{font:600 13px var(--f-mono);fill:var(--muted);letter-spacing:.06em}
.truck .ground{stroke:var(--line);stroke-width:2;stroke-dasharray:2 6}

/* ---------------- INICIO ---------------- */
.lnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.lnav .wrap{display:flex;align-items:center;gap:14px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);margin-right:auto;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--paint) 0 25%,#F4D35E 0 50%,#0E7C66 0 75%,#1D3B8F 0);border:2px solid var(--ink);transition:--paint .9s}
.brand b{font:800 21px/1 var(--f-display);letter-spacing:-.02em}
.lnav .links{display:flex;gap:22px}
.lnav .links a{color:var(--muted);text-decoration:none;font-weight:600;font-size:14px}
.lnav .links a:hover{color:var(--ink)}
@media (max-width:760px){.lnav .links{display:none}}
@media (max-width:420px){.lnav .btn{padding:8px 12px;font-size:13px}.brand b{font-size:18px}}

.hero{padding-block:34px 20px;transition:--paint .9s}
.hero h1{font:800 clamp(46px,8.4vw,112px)/.9 var(--f-display);letter-spacing:-.045em;max-width:13ch}
.hero-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin-top:22px}
@media (max-width:820px){.hero-row{grid-template-columns:minmax(0,1fr)}}
.hero .lede{font-size:19px;color:var(--muted);max-width:52ch}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .fine{font-size:13px;color:var(--muted);margin-top:10px}

.stage{margin-top:34px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border:1.5px solid var(--ink);border-radius:22px;overflow:hidden;background:var(--panel)}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}}
.stage-car{position:relative;padding:22px 22px 8px;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/28px 28px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/28px 28px,
  color-mix(in oklab,var(--paint) 6%,var(--panel));transition:--paint .9s}
.stage-car .tag{position:absolute;left:22px;top:18px;display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px}
.stage-car .tag small{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stage-car .tag b{font:600 22px var(--f-mono)}
.caret{display:inline-block;width:2px;height:20px;background:var(--accent);margin-left:-6px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.truckbox{padding-top:44px;will-change:transform}

.ticket{border-left:1.5px dashed var(--ink);padding:22px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-mono);background:var(--panel)}
@media (max-width:900px){.ticket{border-left:0;border-top:1.5px dashed var(--ink)}}
.ticket .th{display:flex;justify-content:space-between;gap:10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ticket .tname{font:700 18px var(--f-body);line-height:1.25}
.ticket .tmeta{font-size:12px;color:var(--muted)}
.trows{display:flex;flex-direction:column;gap:7px;font-size:14px}
.trow{display:grid;grid-template-columns:14px auto minmax(0,1fr) auto;gap:8px;align-items:center;animation:tin .4s both}
@keyframes tin{from{opacity:0;transform:translateX(-6px)}}
.trow i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.25)}
.trow .dots{border-bottom:2px dotted var(--line);height:0;align-self:center;margin-top:4px}
.ttotal{display:flex;justify-content:space-between;align-items:baseline;border-top:1.5px dashed var(--ink);padding-top:12px;margin-top:auto}
.ttotal span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ttotal b{font-size:34px;font-weight:600}

.rail{display:flex;gap:10px;overflow-x:auto;padding:16px 2px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;border:0;background:none;padding:0;cursor:pointer;text-align:left;transition:transform .25s}
.rchip i{display:block;width:84px;height:54px;border-radius:8px;border:1.5px solid var(--ink)}
.rchip span{font:600 12px var(--f-mono)}
.rchip[aria-pressed="true"]{transform:translateY(-6px)}
.rchip[aria-pressed="true"] i{box-shadow:0 8px 0 -3px var(--ink)}
.railnote{font-size:13px;color:var(--muted)}

.marquee{overflow:hidden;border-block:1.5px solid var(--ink);margin-top:56px;background:var(--panel)}
.marquee div{display:flex;gap:34px;padding:14px 0;white-space:nowrap;font:600 clamp(18px,2.6vw,28px) var(--f-mono);will-change:transform}
.marquee span{display:inline-flex;align-items:center;gap:12px}
.marquee span i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink)}

.lsec{padding-block:80px}
.lsec h2{font:800 clamp(36px,5.4vw,66px)/.95 var(--f-display);letter-spacing:-.04em;margin:14px 0 16px;max-width:18ch}
.lsec .intro{font-size:18px;color:var(--muted);max-width:58ch}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:40px;border-top:1.5px solid var(--ink)}
@media (max-width:820px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{padding:24px 24px 26px 0;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);padding-left:24px}
.step:first-child{padding-left:0}
.step:last-child{border-right:0}
@media (max-width:820px){.step{border-right:0;border-bottom:1px solid var(--line);padding-left:0}}
.step .n{font:600 13px var(--f-mono);color:var(--accent)}
.step h3{font-size:30px}
.step p{color:var(--muted)}
.step .ex{font:600 14px var(--f-mono);margin-top:auto;padding-top:10px;overflow-wrap:anywhere}

.vs{margin-top:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:700px){.vs{grid-template-columns:minmax(0,1fr)}}
.vs ul{list-style:none;margin:0;padding:24px;border-radius:18px;display:flex;flex-direction:column;gap:14px}
.vs .old{border:1.5px dashed var(--line);color:var(--muted)}
.vs .new{background:var(--ink);color:var(--bg)}
.vs li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:16px}
.vs li::before{font:600 14px var(--f-mono)}
.vs .old li::before{content:"×"}
.vs .new li::before{content:"✓";color:var(--hi)}
.vs h3{font:600 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.vs .new h3{color:var(--hi)}

.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px 26px;margin-top:40px}
@media (max-width:900px){.feats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.feats{grid-template-columns:minmax(0,1fr)}}
.feat{display:flex;flex-direction:column;gap:10px;padding-top:18px;border-top:1.5px solid var(--ink)}
.feat .sw{display:flex;gap:4px}
.feat .sw i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink)}
.feat h3{font-size:24px}
.feat p{color:var(--muted);font-size:15px}

.toggle{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:999px;padding:3px;margin-top:22px}
.toggle button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:30px;align-items:stretch}
@media (max-width:900px){.plans{grid-template-columns:minmax(0,1fr)}}
.plan{border:1.5px solid var(--ink);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;background:var(--panel);position:relative}
.plan.star{background:var(--ink);color:var(--bg)}
.plan.star .who,.plan.star .price span{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.plan .ribbon{position:absolute;top:18px;right:18px;background:var(--hi);color:var(--hi-ink);font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
.plan h3{font-size:30px}
.plan .who{color:var(--muted);font-size:15px}
.price{display:flex;align-items:baseline;gap:6px}
.price b{font:800 56px/1 var(--f-display);letter-spacing:-.03em}
.price span{color:var(--muted);font-size:15px}
.plan .yr{font:600 12px var(--f-mono);color:var(--accent);min-height:18px}
.plan.star .yr{color:var(--hi)}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15px}
.plan li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px}
.plan li::before{content:"";width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--accent)}
.plan.star li::before{background:var(--hi)}
.plan .btn{margin-top:auto}
.plan.star .btn{border-color:var(--bg);color:var(--bg)}
.plan.star .btn.primary{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.lsec .fine{margin-top:18px;font-size:13px;color:var(--muted)}

.faq{margin-top:30px;border-top:1.5px solid var(--ink)}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font:600 20px var(--f-body);list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:600 22px var(--f-mono);color:var(--accent);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--muted);margin-top:10px;max-width:70ch}

.final{border-top:1.5px solid var(--ink);background:color-mix(in oklab,var(--paint) 12%,var(--bg));transition:--paint .9s}
.final .wrap{display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between;padding-block:64px}
.final h2{font:800 clamp(34px,5.4vw,64px)/.95 var(--f-display);letter-spacing:-.04em;max-width:16ch}
footer{padding-block:26px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* ---------------- SOFTWARE ---------------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;order:3;flex-basis:100%}
@media (min-width:900px){.tabs{order:0;flex-basis:auto}}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){color:var(--ink)}
.appmain{padding-block:20px 100px}
.view{display:flex;flex-direction:column;gap:16px}

.finder{border:1.5px solid var(--ink);border-radius:18px;background:var(--panel);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:900px){.finder{grid-template-columns:minmax(0,1fr)}}
.fstep{display:flex;flex-direction:column;gap:9px;min-width:0;padding:16px}
.fstep + .fstep{border-left:1px dashed var(--line)}
@media (max-width:900px){.fstep + .fstep{border-left:0;border-top:1px dashed var(--line)}}
.fstep .lab{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fstep .lab b{color:var(--accent)}
.makes{display:flex;gap:6px;flex-wrap:wrap}
.vin input{width:100%;border:1.5px dashed var(--line);border-radius:10px;padding:9px 12px;background:var(--soft);font:500 14px var(--f-mono);text-transform:uppercase}
.vin input::placeholder{text-transform:none;font-family:var(--f-body)}
.vinmsg{font-size:13px;color:var(--muted);min-height:18px}
.vinmsg b{color:var(--ink)}
.qbox{display:flex;align-items:center;gap:10px;border-bottom:2.5px solid var(--ink);padding:2px 0}
.qbox input{flex:1;min-width:0;border:0;background:transparent;font:600 clamp(24px,4vw,34px) var(--f-mono);padding:6px 0;outline:none;text-transform:uppercase}
.qbox input::placeholder{text-transform:none;font:400 16px var(--f-body);color:var(--muted)}
.where{font-size:13px;color:var(--muted)}
.where b{color:var(--ink)}
.ambig{border:1.5px solid var(--ink);background:color-mix(in oklab,var(--hi) 30%,var(--panel));border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ambig .chips{display:flex;gap:6px;flex-wrap:wrap}

.layout{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.results{background:var(--panel);border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;max-height:calc(100vh - 150px);overflow-y:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:860px){.results{max-height:300px;position:static}}
.rcount{padding:10px 14px;font:600 12px var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;display:flex;justify-content:space-between;gap:8px}
.rcount button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.ritem{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:9px 14px;cursor:pointer}
.ritem:hover{background:var(--soft)}
.ritem[aria-current="true"]{background:var(--soft);box-shadow:inset 4px 0 0 var(--paint)}
.ritem .sw{width:40px;height:28px;border-radius:50%;border:1.5px solid var(--ink)}
.ritem b{font-family:var(--f-mono);font-size:15px}
.ritem .nm{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:22px 16px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

.panel{background:var(--panel);border:1.5px solid var(--ink);border-radius:18px;overflow:hidden}
.sec{padding:20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}

const s2l=v=>v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);
const l2s=v=>{v=Math.max(0,Math.min(1,v));return v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055};
const hexToLin=h=>{h=h.replace('#','');return [0,2,4].map(i=>s2l(parseInt(h.substr(i,2),16)/255))};
const linToHex=c=>'#'+c.map(v=>Math.round(l2s(v)*255).toString(16).padStart(2,'0')).join('').toUpperCase();
function linToLab([r,g,b]){
  const X=(0.4124564*r+0.3575761*g+0.1804375*b)/0.95047,Y=0.2126729*r+0.7151522*g+0.0721750*b,Z=(0.0193339*r+0.1191920*g+0.9503041*b)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116;const fx=f(X),fy=f(Y),fz=f(Z);
  return [116*fy-16,500*(fx-fy),200*(fy-fz)];
}
function labToLin([L,a,b]){
  const fy=(L+16)/116,fx=fy+a/500,fz=fy-b/200,fi=t=>{const t3=t*t*t;return t3>0.008856?t3:(t-16/116)/7.787};
  const X=0.95047*fi(fx),Y=fi(fy),Z=1.08883*fi(fz);
  return [3.2404542*X-1.5371385*Y-0.4985314*Z,-0.9692660*X+1.8760108*Y+0.0415560*Z,0.0556434*X-0.2040259*Y+1.0572252*Z].map(v=>Math.max(0,Math.min(1,v)));
}
const dE76=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
function dE00(l1,l2){
  const [L1,a1,b1]=l1,[L2,a2,b2]=l2,rad=Math.PI/180,p7=x=>Math.pow(x,7);
  const Cb=(Math.hypot(a1,b1)+Math.hypot(a2,b2))/2,G=0.5*(1-Math.sqrt(p7(Cb)/(p7(Cb)+p7(25))));
  const a1p=(1+G)*a1,a2p=(1+G)*a2,C1p=Math.hypot(a1p,b1),C2p=Math.hypot(a2p,b2);
  const h=(b,a)=>{if(a===0&&b===0)return 0;let x=Math.atan2(b,a)/rad;return x<0?x+360:x};
  const h1p=h(b1,a1p),h2p=h(b2,a2p),dLp=L2-L1,dCp=C2p-C1p;
  let dhp=0;if(C1p*C2p!==0){dhp=h2p-h1p;if(dhp>180)dhp-=360;else if(dhp<-180)dhp+=360}
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp*rad/2),Lbp=(L1+L2)/2,Cbp=(C1p+C2p)/2;
  let hbp=h1p+h2p;if(C1p*C2p!==0){if(Math.abs(h1p-h2p)>180)hbp+=(h1p+h2p<360)?360:-360;hbp/=2}
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.20*Math.cos((4*hbp-63)*rad);
  const dth=30*Math.exp(-Math.pow((hbp-275)/25,2)),Rc=2*Math.sqrt(p7(Cbp)/(p7(Cbp)+p7(25)));
  const Sl=1+0.015*Math.pow(Lbp-50,2)/Math.sqrt(20+Math.pow(Lbp-50,2)),Sc=1+0.045*Cbp,Sh=1+0.015*Cbp*T,Rt=-Math.sin(2*dth*rad)*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)+Rt*(dCp/Sc)*(dHp/Sh));
}

function softmax(x){const m=Math.max(...x),e=x.map(v=>Math.exp(v-m)),s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s)}
function optimize(ids,target,keepAll){
  let x=ids.map(id=>id==='W'||id==='AL'?2:0);if(target[0]<35&&ids.includes('K'))x[ids.indexOf('K')]=1.5;
  const f=x=>dE76(linToLab(mix(ids,softmax(x))),target);let fb=f(x);
  for(const step of [3,1.5,0.7,0.3,0.12,0.05,0.02]){for(let it=0;it<25;it++){let mv=false;for(let i=0;i<x.length;i++){for(const s of [step,-step]){const y=x.slice();y[i]+=s;const fy=f(y);if(fy<fb-1e-6){x=y;fb=fy;mv=true;break}}}if(!mv)break}}
  let c=softmax(x),use=ids.slice();
  if(!keepAll){const k=c.map(v=>v>=0.0015);use=ids.filter((_,i)=>k[i]);c=c.filter((_,i)=>k[i]);const s=c.reduce((a,b)=>a+b,0);c=c.map(v=>v/s)}
  const lin=mix(use,c),lab=linToLab(lin);return {ids:use,c,lin,lab,dE:dE00(lab,target)};
}
const baseSet=fin=>fin==='M'?['AL','K']:(fin==='P'||fin==='T')?['W','PE','K']:['W','K'];
const cache=new Map();
function solve(target,fin){
  const key=fin+target.map(v=>v.toFixed(1)).join(',');if(cache.has(key))return cache.get(key);
  const base=baseSet(fin),sets=[base];CHROMA.forEach((a,i)=>{sets.push([...base,a]);CHROMA.slice(i+1).forEach(b=>sets.push([...base,a,b]))});
  let best=null;for(const s of sets){const r=optimize(s,target);r.score=r.dE+0.12*r.ids.length;if(!best||r.score<best.score)best=r}
  const ord=best.ids.map((id,i)=>[id,best.c[i]]).sort((a,b)=>b[1]-a[1]);best.ids=ord.map(o=>o[0]);best.c=ord.map(o=>o[1]);
  cache.set(key,best);return best;
}

  const s=stops(hex,fin),key=s.join();if(this.key===key)return;
  const first=this.key===null;this.key=key;
  if(first||RM){this.set(this.a,s);return}
  this.set(this.b,s);cancelAnimationFrame(this.raf);const t0=performance.now(),D=950;
  const step=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3);
    this.w.setAttribute('transform',`translate(${-60*p*3%60},${290-300*e})`);
    if(p<1)this.raf=requestAnimationFrame(step);else{this.set(this.a,s);this.w.setAttribute('transform','translate(0,290)')}};
  this.raf=requestAnimationFrame(step);
};
function countUp(el,to,suffix){
  if(RM){el.textContent=to.toFixed(1)+suffix;return}
  const from=parseFloat(el.textContent)||0,t0=performance.now(),D=650;cancelAnimationFrame(el._r);
  const st=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3);el.textContent=(from+(to-from)*e).toFixed(1)+suffix;if(p<1)el._r=requestAnimationFrame(st)};
  el._r=requestAnimationFrame(st);
}

function quality(dE){return dE<1?['ok',t('q.ok1')]:dE<2?['ok',t('q.ok2')]:dE<4?['warn',t('q.warn')]:['bad',t('q.bad')]}
function parseFormula(str){
  const rev={};Object.keys(TCFG.codes).forEach(id=>{const c=(TCFG.codes[id]||'').trim();if(c)rev[norm(c)]=id});
  const items=String(str).split(/[;|]/).map(s=>s.trim()).filter(Boolean).map(s=>{const [k,v]=s.split(':');return [k&&k.trim(),parseFloat(v)]}).filter(x=>x[0]&&x[1]>0);
  const ids=[],g=[],unknown=[];
  items.forEach(([k,v])=>{const id=TBY[k.toUpperCase()]?k.toUpperCase():rev[norm(k)];if(id){ids.push(id);g.push(v)}else unknown.push(k)});
  const s=g.reduce((a,b)=>a+b,0);return {ids,c:g.map(v=>v/s),unknown};
}

};

Detail.prototype.syncSliders=function(){Object.keys(this.v).forEach(k=>{this.root.querySelector('#vs-'+k).value=this.v[k]})};
Detail.prototype.qtyFromParts=function(){const ready=[...this.parts].reduce((s,i)=>s+PARTS[i][1],0);if(ready>0)this.qty=Math.max(100,Math.ceil(ready*SYSTEMS[this.sys].f*1000/50)*50)};
Detail.prototype.syncQty=function(fromInput){

Detail.prototype.grams=function(f,ml){const dm=1/f.ids.reduce((s,id,i)=>s+f.c[i]/tdens(id),0),W=ml*dm;return f.c.map(c=>c*W)};
function costOf(f,g){let c=0,miss=false;f.ids.forEach((id,i)=>{const p=+TCFG.price[id];if(p>0)c+=g[i]/tdens(id)/1000*p;else miss=true});return {c,miss}}
Detail.prototype.update=function(rows){
  const r=this.root,f=this.f,g=this.grams(f,this.qty),total=g.reduce((a,b)=>a+b,0);let acc=0;
  countUp(r.querySelector('#ftotal'),total,' g');
  const cs=costOf(f,g);r.querySelector('#fcost').textContent=cs.c>0?t('cost',cs.c.toFixed(2),cs.miss):t('nocost');
  const cup=r.querySelector('#fcup');cup.innerHTML=f.ids.map(id=>`<i style="background:${TBY[id].hex}"></i>`).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>cup.querySelectorAll('i').forEach((el,i)=>el.style.width=(f.c[i]*100)+'%')));
  r.querySelector('#fbody').innerHTML=f.ids.map((id,i)=>{acc+=g[i];const x=TBY[id];
    return `<tr style="animation-delay:${rows?i*70:0}ms"><td><span class="tdot" style="background:${x.hex}"></span><span class="tc">${esc(tcode(id))}</span><span class="tn">${esc(tname(id))}</span></td><td class="n">${(f.c[i]*100).toFixed(1)}</td><td class="n">${g[i].toFixed(1)}</td><td class="n"><b>${this.cum?acc.toFixed(1):''}</b></td></tr>`}).join('');

  r.querySelector('#qsum').innerHTML=t('sum',(this.qty/1000).toFixed(2)+' L',ready>=1000?(ready/1000).toFixed(2)+' L':Math.round(ready)+' ml')+tip;

Detail.prototype.targetVar=function(){const [Lx,a,b]=this.lab,k=1+this.v.C/100;return [Math.max(1,Math.min(99,Lx+this.v.L)),a*k+this.v.a,b*k+this.v.b]};
Detail.prototype.updateVar=function(){
  const r=this.root,v=this.v,changed=v.L||v.a||v.b||v.C,tl=this.targetVar(),hex=linToHex(labToLin(tl));
  r.querySelector('#vsw').style.background=finishBg(hex,this.col.acabado);
  const out=r.querySelector('#vout'),info=r.querySelector('#vinfo');this.vf=null;
  if(!changed){info.textContent=t('v.hint');out.innerHTML='';this.truck.paint(this.col.hex,this.col.acabado);setPaint(this.col.hex);return}
  info.textContent=t('v.diff',dE00(this.lab,tl).toFixed(1));
  this.truck.paint(hex,this.col.acabado);setPaint(hex);
  const g0=this.grams(this.f,this.qty),ids0=this.f.ids;
  let best=optimize(ids0.slice(),tl,true);
  for(const x of CHROMA){if(ids0.includes(x))continue;const rr=optimize([...ids0,x],tl,true);if(rr.dE+0.4<best.dE)best=rr}
  const full=solve(tl,this.col.acabado),keep=best.c.map(x=>x>=0.0015);
  const fam={ids:best.ids.filter((_,i)=>keep[i]),c:best.c.filter((_,i)=>keep[i])},sc=fam.c.reduce((a,b)=>a+b,0);fam.c=fam.c.map(x=>x/sc);
  const nf=best.dE<=full.dE+0.6?Object.assign({},best,fam):full;this.vf=nf;this.vhex=hex;
  const g=this.grams(nf,this.qty);
  let k=0;ids0.forEach((id,i)=>{const j=best.ids.indexOf(id);k=Math.max(k,g0[i]/Math.max(best.c[j],1e-9))});
  const tot0=g0.reduce((a,b)=>a+b,0);let corr;
  if(k/tot0>2.2)corr=`<div class="corr"><b>${t('v.new')}</b><span class="small muted">${t('v.newp')}</span></div>`;
  else{const adds=best.ids.map((id,j)=>{const i=ids0.indexOf(id);return [id,k*best.c[j]-(i>=0?g0[i]:0)]}).filter(x=>x[1]>=0.05);
    corr=`<div class="corr"><b>${t('v.add',tot0.toFixed(1))}</b><ul>${adds.map(([id,gr])=>`<li><span class="mono">${gr.toFixed(1)} g</span> ${t('v.of')} <b>${esc(tcode(id))}</b> · ${esc(tname(id))}</li>`).join('')||`<li>${t('v.none')}</li>`}</ul><span class="small muted">${t('v.prec',best.dE.toFixed(1))}</span></div>`}
  out.innerHTML=`<div class="tablewrap"><table><thead><tr><th>${t('v.th')}</th><th class="n">%</th><th class="n">${t('th.g')}</th></tr></thead><tbody>${nf.ids.map((id,i)=>`<tr><td><span class="tdot" style="background:${TBY[id].hex}"></span><span class="tc">${esc(tcode(id))}</span> <span class="small muted">${esc(tname(id))}</span></td><td class="n">${(nf.c[i]*100).toFixed(1)}</td><td class="n">${g[i].toFixed(1)}</td></tr>`).join('')}</tbody></table></div>${corr}`;
};

function copy(text){const done=()=>toast(t('copied'));

}
function matchScore(c,q,qr){
  if(!q)return 0;
  const codes=[c.codigo,...(c.alias||[])].map(norm);
  if(codes.includes(q))return 100;
  if(codes.some(x=>x.startsWith(q)))return 60;
  if(q.length>=3&&codes.some(x=>x.includes(q)))return 40;
  const words=fold(qr).split(/\s+/).filter(w=>w.length>2),hay=fold(c.nombre+' '+c.marca);
  if(words.length&&words.every(w=>hay.includes(w)||(ES[w]&&ES[w].split(' ').some(x=>hay.includes(x)))))return 20;
  return 0;
}
const cleanQuery=raw=>norm(raw).replace(/^BCCC/,'').replace(/^(EXTPNT|PAINT|COLOR|PNT)/,'');
function search(){
  const raw=$('#q').value,q=cleanQuery(raw),qr=raw.trim();
  const pool=make&&!showAll?allColors().filter(c=>c.marca===make):allColors();
  let list=pool;
  if(q)list=pool.map(c=>[matchScore(c,q,qr),c]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const exact=q?list.filter(c=>matchScore(c,q,qr)===100):[],exMakes=[...new Set(exact.map(c=>c.marca))];
  const multi=exMakes.length>1&&(!make||showAll),hint=!make&&q?formatHint(q):null;
  $('#ambig').innerHTML=multi?`<div class="ambig"><b>${esc(t('ambig',qr.toUpperCase(),exMakes.length))}</b><div class="chips">${exMakes.map(m=>`<button class="chip" type="button" data-pick="${esc(m)}">${esc(m)}</button>`).join('')}</div></div>`
    :(hint&&!exact.length?`<div class="ambig"><b>${esc(t('hint',hint))}</b><span class="small">${t('hint.p')}</span></div>`:'');
  let head=`<span>${esc(t('count',list.length,make&&!showAll?make:''))}</span>`;
  if(make&&showAll)head+=`<button type="button" id="onlymake">${esc(t('only',make))}</button>`;
  const el=$('#results');
  el.innerHTML=`<div class="rcount">${head}</div>`+(list.length?list.map((c,i)=>`<button class="ritem" type="button" data-i="${i}" aria-current="${c===current}"><span class="sw" style="background:${finishBg(c.hex,c.acabado)}"></span><span style="min-width:0"><b>${esc(c.codigo)}</b><span class="nm">${esc(c.marca)} · ${esc(c.nombre)}</span></span><span class="fin">${t('fin.'+c.acabado)}</span></button>`).join('')
    :`<div class="empty"><span>${make&&!showAll?t('empty.make',esc(qr),esc(make)):t('empty.all')}</span>${make&&!showAll?`<button class="btn" type="button" id="seeall">${t('seeall')}</button>`:''}<button class="btn" type="button" id="gofree">${t('gofree')}</button></div>`);
  el.querySelectorAll('.ritem').forEach(b=>b.addEventListener('click',()=>select(list[+b.dataset.i],true)));
  const sa=$('#seeall');if(sa)sa.onclick=()=>{showAll=true;search()};
  const om=$('#onlymake');if(om)om.onclick=()=>{showAll=false;search()};
  const gf=$('#gofree');if(gf)gf.onclick=()=>show('libre');
  return {list,exact,ambiguous:multi};
}

  if(scroll&&window.matchMedia('(max-width:860px)').matches)$('#detail').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});

  const r=decodeVin($('#vin').value),m=$('#vinmsg');vinInfo=null;
  if(r.err!==undefined){m.textContent=r.err;return false}
  if(!r.make){m.innerHTML=t('vin.unk',esc(r.wmi));return false}
  vinInfo=r;m.innerHTML=t('vin.ok',esc(r.make),r.year);return true;
}
$('#vin').addEventListener('input',()=>{if(vinUpdate()){make=vinInfo.make;showAll=false;renderMakes();autoPick()}});

$('#fphoto').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const cv=$('#fcanvas'),w=Math.min(1000,img.width),h=Math.round(img.height*w/img.width);cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);cv.hidden=false;$('#fphotonote').hidden=false;URL.revokeObjectURL(url)};img.src=url});
$('#fcanvas').addEventListener('click',e=>{const cv=e.currentTarget,rc=cv.getBoundingClientRect(),x=Math.round((e.clientX-rc.left)*cv.width/rc.width),y=Math.round((e.clientY-rc.top)*cv.height/rc.height);
  const d=cv.getContext('2d').getImageData(Math.max(0,x-4),Math.max(0,y-4),9,9).data,s=[0,0,0];let n=0;
  for(let i=0;i<d.length;i+=4){s[0]+=s2l(d[i]/255);s[1]+=s2l(d[i+1]/255);s[2]+=s2l(d[i+2]/255);n++}
  $('#fhex').value=linToHex(s.map(v=>v/n));freeUpdate()});

$('#doimport').addEventListener('click',()=>{
  const lines=$('#csv').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);if(lines.length&&/^marca\s*,/i.test(lines[0]))lines.shift();
  const ok=[],bad=[];
  lines.forEach((l,i)=>{let [marca,codigo,nombre,acabado,hex,formula,alias]=l.split(',').map(s=>s.trim());hex=(hex||'').startsWith('#')?hex:'#'+hex;acabado=(acabado||'S').toUpperCase()[0];
    if(marca&&codigo&&/^#[0-9a-f]{6}$/i.test(hex))ok.push({marca,codigo,nombre:nombre||codigo,acabado:'SMPT'.includes(acabado)?acabado:'S',hex:hex.toUpperCase(),formula:formula||'',alias:(alias||'').split(/\s+/).filter(Boolean),src:'imp'});else bad.push(i+2)});
  const key=c=>c.marca+'|'+norm(c.codigo),map=new Map(IMPORTED.map(c=>[key(c),c]));ok.forEach(c=>map.set(key(c),c));
  IMPORTED=[...map.values()];store.set('imported',IMPORTED);renderMakes();search();
  $('#importmsg').textContent=t('imp.msg',ok.length,bad.join(', '));
});
$('#clearimport').addEventListener('click',()=>{IMPORTED=[];store.set('imported',[]);renderMakes();search();$('#importmsg').textContent=t('imp.cleared')});

/* ================= Asesor de pintura (guía de preguntas frecuentes) ================= */
const KB=[
 {l:'b',k:'code label where find paint code door jamb glove box vin codigo etiqueta donde encuentro puerta guantera',
  en:['Where do I find the paint code?',"Usually on a label in the driver's door jamb. GM trucks often have it in the glove box (look for BC/CC U8555 or WA8555). VW puts it in the trunk, Subaru under the hood. The VIN doesn't contain the paint code, but in this app it tells you the make and year. Pick the make in step 1 and the app shows you where to look."],
  es:['¿Dónde encuentro el código de pintura?','Normalmente en una etiqueta en el marco de la puerta del conductor. En camionetas GM suele estar en la guantera (busca BC/CC U8555 o WA8555). VW lo pone en la cajuela y Subaru bajo el cofre. El VIN no trae el código de pintura, pero en esta app te da la marca y el año. Elige la marca en el paso 1 y la app te dice dónde buscar.']},
 {l:'b',k:'match mismatch silver plata metallic metalico right code doesnt match different color wrong not matching igualar no iguala codigo correcto diferente',
  en:["I used the right code. Why doesn't it match?","It's the most common complaint on paint forums. One code can have several variants (lighter, standard, darker, depending on plant and year). The old paint may be sun-faded. The primer or sealer color changes the result. And the way you spray (pressure, distance, number of coats) shifts the color, especially metallics. Spray a test card, compare it to the car, and use the Variations section to tint. Blend into the next panel if needed."],
  es:['Usé el código correcto. ¿Por qué no iguala?','Es la queja número uno en los foros. Un mismo código puede tener variantes (más claro, estándar, más oscuro, según planta y año). La pintura vieja puede estar quemada por el sol. El color del fondo o sellador cambia el resultado. Y la forma de aplicar (presión, distancia, número de manos) mueve el color, sobre todo en metálicos. Haz carta de prueba, compárala con el carro y usa Variaciones para ajustar. Si hace falta, difumina al panel de al lado.']},
 {l:'b',k:'spray out card test card carta prueba muestra how to compare',
  en:['What is a spray-out card and how do I use it?',"A test card you spray exactly like the job: same gun, pressure, number of coats and clear. Let it dry, then hold it against the car in daylight, head-on and at an angle. Most cards have a black-and-white strip so you can see when the color fully hides. Write the coats and settings on the back. If it doesn't match, tint and spray another card before touching the car."],
  es:['¿Qué es la carta de prueba y cómo se usa?','Es una tarjeta que pintas igual que el trabajo: misma pistola, presión, número de manos y barniz. Déjala secar y ponla junto al carro a la luz del día, de frente y en ángulo. Casi todas traen una franja blanca y negra para ver cuándo el color ya cubre. Anota atrás las manos y los ajustes. Si no iguala, ajusta el color y pinta otra carta antes de tocar el carro.']},
 {l:'b',k:'blend blending difuminar difuminado adjacent panel next panel when how far',
  en:['When do I need to blend, and how far?',"Blend when the new color won't be invisible next to the old one: almost always with silvers, light metallics and pearls. Paint the repaired panel, then fade the basecoat into the middle of the next panel, extending each coat a few inches past the last one. Clear the whole panels. Dusting a light coat over the full panel isn't a blend. A slower reducer helps the edge lay down."],
  es:['¿Cuándo tengo que difuminar y hasta dónde?','Difumina cuando el color nuevo no va a quedar invisible junto al viejo: casi siempre con platas, metálicos claros y perlas. Pinta el panel reparado y luego desvanece la base hasta la mitad del panel de al lado, alargando cada mano unos centímetros más que la anterior. Barniza los paneles completos. Echar una mano ligera a todo el panel no es difuminar. Un reductor más lento ayuda a que la orilla asiente.']},
 {l:'b',k:'single stage basecoat clearcoat monocapa bicapa base barniz difference which easier',
  en:['Single stage or basecoat/clearcoat?',"Single stage is color and gloss in one product: fewer steps, and runs or small repairs are easier to fix. Basecoat/clearcoat is color first, then a clear layer: more depth and gloss, better protection, and clear you can sand and polish. Most modern cars are base/clear, and metallics and pearls need it. Forums disagree on which is easier for beginners; practice on a scrap panel either way."],
  es:['¿Monocapa o bicapa (base + barniz)?','La monocapa es color y brillo en un solo producto: menos pasos, y los escurridos o retoques se arreglan más fácil. La bicapa es primero el color y luego el barniz: más profundidad y brillo, más protección y barniz que puedes lijar y pulir. Casi todos los carros modernos son bicapa, y los metálicos y perlados la necesitan. En los foros no se ponen de acuerdo en cuál es más fácil para empezar; practica en una pieza de desecho.']},
 {l:'b',k:'how much paint need buy quantity cuanta pintura necesito comprar cantidad litros galon',
  en:['How much paint do I need?','Tap the parts you are painting in the Amount section and the app estimates the color base, already accounting for the reducer of your system. As a guide, a door or bumper takes about half a liter ready to spray, a whole sedan about 3 liters. Mix a bit extra for test cards and touch-ups, and for big jobs mix everything at once so it doesn\'t vary between batches.'],
  es:['¿Cuánta pintura necesito?','Marca las piezas en la sección Cantidad y la app calcula el color base, ya contando el reductor de tu sistema. Como guía, una puerta o defensa lleva cerca de medio litro listo para aplicar y un sedán completo unos 3 litros. Prepara un poco de más para cartas de prueba y retoques, y en trabajos grandes mezcla todo de una vez para que no varíe entre mezclas.']},
 {l:'b',k:'mix ratio hardener reducer catalyst thinner proporcion catalizador reductor diluyente 4:1:1 mezcla',
  en:['How do I mix hardener and reducer?',"Always follow the technical data sheet (TDS) of your product: ratios change between brands and lines. Common examples: basecoat reduced about 1:1, 2K single stage around 4:1:1 (paint:hardener:reducer). Use ratio cups or a scale, never guess the hardener. Pick the reducer speed for your temperature. If the paint sprays badly, check viscosity with a cup before adding more thinner."],
  es:['¿Cómo mezclo el catalizador y el reductor?','Sigue siempre la ficha técnica (TDS) de tu producto: las proporciones cambian entre marcas y líneas. Ejemplos comunes: base reducida más o menos 1:1, monocapa 2K alrededor de 4:1:1 (pintura:catalizador:reductor). Usa vaso medidor o báscula; nunca le calcules el catalizador a ojo. Escoge la velocidad del reductor según la temperatura. Si la pintura sale mal, revisa la viscosidad con copa antes de agregar más diluyente.']},
 {l:'b',k:'flash time between coats wait oreo tiempo entre manos esperar matte dry',
  en:['How long do I wait between coats?',"Until the basecoat turns matte (flat) evenly. Data sheets usually say 3 to 10 minutes at about 70 °F / 20 °C, and longer before clear. Cold, humidity, heavy coats and poor air flow make it slower. Don't rush it by blowing air with the gun: short flash time causes mottling in metallics and solvent pop in the clear."],
  es:['¿Cuánto espero entre manos?','Hasta que la base se vea mate de forma pareja. Las fichas técnicas suelen dar de 3 a 10 minutos a unos 20 °C, y más antes del barniz. El frío, la humedad, las manos muy cargadas y poca ventilación lo alargan. No lo apures soplando aire con la pistola: el oreo corto causa manchas en metálicos y burbujas en el barniz.']},
 {l:'b',k:'gun tip size nozzle pressure psi hvlp pistola boquilla presion libras setup distance distancia',
  en:['What tip size and pressure should I use?',"Check your gun's manual and the paint's data sheet first. Common starting points: 1.2–1.4 mm for basecoat, 1.3–1.4 mm for clear, 1.7–2.0 mm for primer. Measure air pressure at the gun inlet, not at the compressor regulator, because the hose loses pressure. With HVLP, hold the gun about 6–8 in (15–20 cm) away, overlap each pass about half, and test the fan pattern on paper first."],
  es:['¿Qué boquilla y qué presión uso?','Revisa primero el manual de tu pistola y la ficha técnica de la pintura. Puntos de partida comunes: 1.2–1.4 mm para base, 1.3–1.4 mm para barniz, 1.7–2.0 mm para primer. Mide la presión en la entrada de la pistola, no en el regulador del compresor, porque la manguera pierde presión. Con HVLP mantén la pistola a unos 15–20 cm, traslapa cada pasada a la mitad y prueba el abanico en papel primero.']},
 {l:'b',k:'orange peel piel naranja texture textura fix',
  en:['How do I fix orange peel?','Orange peel comes from paint that is too thick, low air pressure, the gun too far or moving too fast. Once cured, wet sand with a block (around 1500, then 2000–3000 grit) and polish, only if there is enough clear to sand. Beginners often spray 3 to 4 coats of clear to leave room for that.'],
  es:['¿Cómo quito la piel de naranja?','La piel de naranja sale por pintura muy espesa, poca presión de aire, pistola muy lejos o pasadas muy rápidas. Ya curado, lija al agua con taco (más o menos 1500 y luego 2000–3000) y pule, solo si hay suficiente barniz para lijar. Muchos principiantes dan 3 o 4 manos de barniz para tener ese margen.']},
 {l:'b',k:'runs sags drips escurridos chorreado colgado fix',
  en:['How do I fix runs?','Runs come from coats that are too heavy, the gun too close or moving too slowly. Let the paint cure fully, then level the run with a razor blade or a hard block and fine sandpaper, and polish. In base/clear, a run in the clear is usually fixable this way; a run in the base may need re-spraying the panel.'],
  es:['¿Cómo arreglo un escurrido?','Los escurridos salen por manos muy cargadas, pistola muy cerca o pasadas muy lentas. Deja curar bien la pintura, empareja el escurrido con navaja o taco duro y lija fina, y pule. En bicapa, un escurrido en el barniz casi siempre se arregla así; uno en la base puede requerir repintar el panel.']},
 {l:'b',k:'fisheyes fish eyes ojos pescado craters crateres silicone silicon contamination',
  en:['What causes fisheyes?',"Contamination on the surface: silicone, wax, oil, or even hand lotion. Clean with wax and grease remover before sanding and again before painting, wipe dry with a clean cloth, and tack rag right before spraying. Keep silicone products away from the shop and check your air line for oil and water."],
  es:['¿Qué causa los ojos de pescado?','Contaminación en la superficie: silicón, cera, aceite o hasta crema de manos. Limpia con desengrasante antes de lijar y otra vez antes de pintar, seca con trapo limpio y pasa trapo atrapapolvo justo antes de aplicar. Mantén los productos con silicón lejos del taller y revisa que la línea de aire no traiga aceite ni agua.']},
 {l:'b',k:'solvent pop bubbles burbujas poros pinholes clear',
  en:['Why do I get bubbles (solvent pop) in the clear?',"Solvent got trapped under a surface that dried too fast. Usual causes: coats too heavy, not enough flash time, a reducer too fast for the temperature, or heat applied too soon. Spray medium coats, wait the flash time from the data sheet, and keep a distance of about 6–8 in (15–20 cm)."],
  es:['¿Por qué me salen burbujas en el barniz?','El solvente quedó atrapado bajo una capa que secó muy rápido. Causas comunes: manos muy cargadas, poco oreo, reductor muy rápido para la temperatura o calor aplicado muy pronto. Aplica manos medianas, respeta el oreo de la ficha técnica y mantén una distancia de unos 15–20 cm.']},
 {l:'b',k:'safety respirator mask isocyanate seguridad mascarilla respirador catalizador toxic toxico health salud',
  en:['What protection do I need?',"2K hardeners contain isocyanates, which can cause serious and permanent breathing problems. Use a properly fitted respirator rated for paint (a supplied-air system is the safest), nitrile gloves, eye protection and good ventilation, and keep other people out of the area. Read the safety data sheet of every product."],
  es:['¿Qué protección necesito?','Los catalizadores 2K llevan isocianatos, que pueden causar problemas respiratorios graves y permanentes. Usa un respirador para pintura bien ajustado (el de aire suministrado es el más seguro), guantes de nitrilo, lentes y buena ventilación, y no dejes que otras personas estén cerca. Lee la hoja de seguridad de cada producto.']},
 {l:'b',k:'temperature cold hot humidity weather temperatura frio calor humedad clima reducer speed',
  en:['Does temperature matter?','A lot. Pick the reducer speed for the temperature: fast for cold, medium around 70–80 °F (20–27 °C), slow for heat or big panels. Cold slows flash and cure; heat can cause dry spray and solvent pop. High humidity can make clear look cloudy. Avoid painting below the minimum temperature on the data sheet.'],
  es:['¿Importa la temperatura?','Mucho. Escoge la velocidad del reductor según la temperatura: rápido para frío, medio alrededor de 20–27 °C, lento para calor o paneles grandes. El frío alarga el oreo y el curado; el calor puede dar pintura seca y burbujas. La humedad alta puede dejar el barniz opaco. No pintes por debajo de la temperatura mínima de la ficha técnica.']},
 {l:'b',k:'primer sealer color under fondo sellador gris shade tono debajo',
  en:['Does the primer color matter?','Yes. Colors with low hiding, like reds, yellows, some whites and pearls, look different over light or dark primer. Use the sealer or primer shade recommended for your color (many brands give a gray value), and spray your test card over the same shade you will use on the car.'],
  es:['¿Importa el color del fondo?','Sí. Los colores que cubren poco, como rojos, amarillos, algunos blancos y perlas, se ven distintos sobre fondo claro u oscuro. Usa el tono de sellador o fondo recomendado para tu color (muchas marcas indican un gris) y haz la carta de prueba sobre ese mismo tono.']},
 {l:'p',k:'metallic mottling striping tiger stripes manchas rayas metalico nublado clouding',
  en:['How do I avoid mottling and striping in metallics?',"Keep the same distance, speed and overlap (about 50–75%) on every pass, and let each coat flash until matte. Don't apply heavy wet coats. Stir the paint well. Many painters finish with a lighter control coat at the same or slightly greater distance to even out the aluminum. If it shows after clear, it has to be sanded and re-sprayed."],
  es:['¿Cómo evito manchas y rayas en metálicos?','Mantén la misma distancia, velocidad y traslape (50–75%) en cada pasada y deja orear cada mano hasta que esté mate. No apliques manos muy cargadas. Agita bien la pintura. Muchos pintores terminan con una mano de control más ligera, a la misma distancia o un poco más lejos, para emparejar el aluminio. Si aparece después del barniz, hay que lijar y repintar.']},
 {l:'p',k:'tri coat tricoat pearl white let down panel tricapa perla blanca cuantas manos coats midcoat',
  en:['How many pearl coats on a tri-coat?',"There's no fixed number: it depends on the car and your technique. Make a let-down panel: one card with the ground coat, then mask strips and spray 1, 2, 3 and 4 coats of pearl, clear it all, and compare to the car. Write the number of passes on the back. Use the same count on the job and blend both the ground coat and the pearl."],
  es:['¿Cuántas manos de perla lleva un tricapa?','No hay número fijo: depende del carro y de tu técnica. Haz un panel de prueba: una carta con la base de fondo, luego enmascara franjas y aplica 1, 2, 3 y 4 manos de perla, barniza todo y compara con el carro. Anota atrás el número de pasadas. Usa ese mismo número en el trabajo y difumina tanto la base como la perla.']},
 {l:'p',k:'variant variants variante variantes which choose escoger dealer plant year deck chips',
  en:['How do I pick the right variant of a code?',"Clean and polish a spot on the car first, so you compare against real color and not oxidation. Then compare variant chips or test cards in daylight, head-on and from the side. The model year and plant help narrow it down. If none is exact, start from the closest one and tint; in this app, use Variations to see how far you are."],
  es:['¿Cómo escojo la variante correcta de un código?','Primero limpia y pule una zona del carro, para comparar contra el color real y no contra la oxidación. Luego compara chips de variantes o cartas de prueba a la luz del día, de frente y de lado. El año y la planta ayudan a descartar. Si ninguna es exacta, parte de la más cercana y ajusta; en esta app usa Variaciones para ver qué tan lejos estás.']},
 {l:'p',k:'tint tinting adjust ajustar entonar color add toner corregir how much',
  en:['How should I tint a color that is off?',"Decide first what is wrong: lighter or darker, which hue direction, and whether it's dirty or clean. Tint with toners already in the formula, in small steps (1–2% of the mix), one toner at a time, and spray a card after each change. Write everything down. In this app, move the Variation sliders and it shows you the grams to add to what you already mixed."],
  es:['¿Cómo ajusto un color que no quedó?','Primero decide qué está mal: más claro u oscuro, hacia qué tono, y si está sucio o limpio. Ajusta con los tintes que ya trae la fórmula, en pasos chicos (1–2% de la mezcla), un tinte a la vez, y pinta una carta después de cada cambio. Anótalo todo. En esta app mueve las barras de Variación y te dice los gramos a agregar a lo que ya mezclaste.']},
 {l:'p',k:'flop face side tone angle metallic darker lighter wet dry aplicacion humeda seca angulo lado frente',
  en:['Why does a metallic look right from the front but wrong from the side?',"That's flop. How you spray changes where the aluminum flakes sit: wetter coats usually look darker head-on and lighter from the side, drier coats the opposite. Adjust the technique first (pressure, distance, flash), and tint only after the application matches the factory look."],
  es:['¿Por qué un metálico se ve bien de frente y mal de lado?','Eso es el "flop". La forma de aplicar cambia cómo se acomoda el aluminio: las manos más húmedas suelen verse más oscuras de frente y más claras de lado, y las más secas al revés. Ajusta primero la técnica (presión, distancia, oreo) y entona el color solo cuando la aplicación ya se parezca a la de fábrica.']},
 {l:'p',k:'metamerism light lighting daylight luz dia lampara looks different sun shop',
  en:['Why does the color match in the shop but not outside?','That is metamerism: two colors made with different pigments can match under one light and not under another. Always check cards in daylight, under a color-corrected lamp, and under your shop lights. If they only match under one, tint toward the daylight match.'],
  es:['¿Por qué iguala en el taller pero no afuera?','Eso es metamerismo: dos colores hechos con pigmentos distintos pueden igualar con una luz y no con otra. Revisa siempre las cartas a la luz del día, con lámpara de color corregido y con la luz del taller. Si solo igualan con una, ajusta hacia la que iguala con luz de día.']},
 {l:'p',k:'scale weigh weight grams cumulative bascula pesar gramos acumulado overshoot me pase',
  en:['How do I use the scale formula, and what if I overshoot?',"Put the empty cup on the scale and zero it. The formula is cumulative: add each toner until the scale reaches the number in the Scale column. If you overshoot a toner, don't remove paint: recalculate the other toners in proportion, or use Variations to see what to add. Stir well and keep toners agitated."],
  es:['¿Cómo uso la fórmula en báscula y qué hago si me paso?','Pon el vaso vacío en la báscula y ponla en cero. La fórmula es acumulada: agrega cada tinte hasta que la báscula marque el número de la columna Báscula. Si te pasas de un tinte, no saques pintura: recalcula los demás en proporción o usa Variaciones para ver qué agregar. Revuelve bien y mantén los tintes agitados.']},

  es:['¿Cuántas manos de barniz y cuándo puedo lijar?','Normalmente 2 manos, o 3 si vas a lijar y pulir. Respeta el oreo entre ellas. El tiempo para lijar y pulir depende del barniz y de la temperatura; revisa la ficha técnica (algunos permiten al día siguiente, otros necesitan más tiempo u horneado).']},

  es:['¿Qué velocidad de reductor uso?','Depende de la temperatura y del tamaño del trabajo. Rápido para días fríos y reparaciones chicas, medio para temperatura normal de taller, lento para calor, paneles grandes y difuminados, porque da más tiempo a que la pintura asiente. Muy rápido da pintura seca y difuminados malos; muy lento puede escurrir.']}

const STOP=new Set('why does doesn how what when where which the and for can you your are with this that not but get que como por para los las del una uno con mis tus esta este cuando donde cual porque pero sin muy hay'.split(' '));
const toks=s=>fold(s).split(/[^a-z0-9]+/).filter(w=>w.length>2&&!STOP.has(w));
const KBI=KB.map(x=>({x,key:new Set(toks(x.k)),qs:new Set(toks(x.en[0]+' '+x.es[0]))}));
function kbFind(q){
  const ws=toks(q);if(!ws.length)return [];
  const near=(set,w)=>w.length>=4&&[...set].some(v=>v.startsWith(w.slice(0,5))||w.startsWith(v.slice(0,5))&&v.length>=4);
  return KBI.map(({x,key,qs})=>{let s=0;ws.forEach(w=>{if(key.has(w))s+=3;else if(near(key,w))s+=2;else if(qs.has(w))s+=1});return [s,x]}).filter(r=>r[0]>=2).sort((a,b)=>b[0]-a[0]).map(r=>r[1]);
}

}

const demo={running:true,i:0,col:null,truck:new Truck($('#dtruck')),hold:0,list:[['Mazda','46V'],['Chevrolet / GMC','GAZ'],['Subaru','K7X'],['Ford','PQ'],['Toyota','1G3'],['Nissan','NAH'],['RAL','RAL 6018'],['Honda','B-593M']]};
const demoCols=demo.list.map(([m,c])=>BASE.find(x=>x.marca===m&&x.codigo===c)).filter(Boolean);
$('#rail').innerHTML=demoCols.map((c,i)=>`<button class="rchip" type="button" data-i="${i}" aria-pressed="false" aria-label="${esc(c.marca+' '+c.codigo)}"><i style="background:${finishBg(c.hex,c.acabado)}"></i><span>${esc(c.codigo)}</span></button>`).join('');
$('#marq').innerHTML=Array(3).fill(BASE.filter((_,i)=>i%3===0).map(c=>`<span><i style="background:${c.hex}"></i>${esc(c.codigo)}</span>`).join('')).join('');
function demoShow(col,typed){
  $('#dtyped').textContent=typed;
  if(typed!==col.codigo)return;
  demo.col=col;
  const f=solve(linToLab(hexToLin(col.hex)),col.acabado),fin=t('fin.'+col.acabado);
  $('#dname').textContent=col.nombre;$('#dmeta').textContent=`${col.marca} · ${fin} · ΔE ${f.dE.toFixed(1)}`;
  demo.truck.label(col.codigo,fin.toUpperCase());demo.truck.paint(col.hex,col.acabado);
  if(demo.running)setPaint(col.hex);
  document.querySelectorAll('#rail .rchip').forEach((b,i)=>b.setAttribute('aria-pressed',String(demoCols[i]===col)));
  const dm=1/f.ids.reduce((s,id,i)=>s+f.c[i]/TBY[id].d,0),g=f.c.map(c=>c*250*dm);let acc=0;
  $('#drows').innerHTML=f.ids.slice(0,5).map((id,i)=>{acc+=g[i];return `<div class="trow" style="animation-delay:${i*90}ms"><i style="background:${TBY[id].hex}"></i><span>${id} <span class="muted">${esc(tname(id))}</span></span><span class="dots"></span><span>${acc.toFixed(1)} g</span></div>`}).join('');
  countUp($('#dtotal'),g.reduce((a,b)=>a+b,0),' g');
}
function demoRefresh(){if(demo.col)demoShow(demo.col,demo.col.codigo)}
let demoTimer;
function demoNext(){
  clearTimeout(demoTimer);
  if(!demo.running||document.hidden||Date.now()<demo.hold){demoTimer=setTimeout(demoNext,900);return}
  const col=demoCols[demo.i++%demoCols.length];
  if(RM){demoShow(col,col.codigo);demoTimer=setTimeout(demoNext,5000);return}
  let k=0;const type=()=>{if(Date.now()<demo.hold)return demoNext();k++;demoShow(col,col.codigo.slice(0,k));if(k<col.codigo.length)demoTimer=setTimeout(type,130);else demoTimer=setTimeout(demoNext,3600)};
  $('#dtyped').textContent='';demoTimer=setTimeout(type,300);
}

/* ================= Movimiento con el scroll ================= */
let riseReady=false,io=null;
function observeRise(){
  if(!('IntersectionObserver' in window)||RM){document.querySelectorAll('.rise.pre').forEach(el=>el.classList.remove('pre'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.remove('pre');io.unobserve(en.target)}}),{rootMargin:'0px 0px -8% 0px'});
  document.querySelectorAll('.rise.pre').forEach(el=>io.observe(el));
}
const prog=$('#prog'),marq=$('#marq'),tbox=$('#dtruck');let ticking=false;
function onScroll(){
  if(ticking)return;ticking=true;
  requestAnimationFrame(()=>{ticking=false;
    const y=window.scrollY,h=document.documentElement.scrollHeight-innerHeight;
    prog.style.setProperty('--p',h>0?Math.min(1,y/h):0);
    if(RM||!$('#app').hidden)return;
    marq.style.transform=`translateX(${-(y*0.35)%(marq.scrollWidth/3)}px)`;
    tbox.style.transform=`translateY(${Math.min(40,y*0.06)}px)`;
  });
}
window.addEventListener('scroll',onScroll,{passive:true});

applyLang();riseReady=true;observeRise();route();demoNext();
