<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramírez Auto & Diesel · Pulaski, TN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--azul:#0B3D91;--azul2:#E8EEF9;--rojo:#D62828;--tinta:#141A26;--gris:#5F6B7D;--linea:#DCE2EC}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--tinta);font:16px/1.6 "Archivo",system-ui,sans-serif}
  :focus-visible{outline:3px solid var(--rojo);outline-offset:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px}
  .demo{background:var(--azul2);color:var(--azul);text-align:center;font-size:13px;padding:7px 16px}
  .demo a{color:var(--azul);font-weight:600}
  .util{background:var(--azul);color:#fff;font-size:14px}
  .util .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 20px}
  .util a{color:#fff;font-weight:600;text-decoration:none}
  nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--tinta);font:800 20px "Archivo"}
  .mark{width:38px;height:38px;border-radius:8px;background:var(--rojo);color:#fff;display:grid;place-items:center;font:800 20px "Archivo"}
  .lang{background:#fff;border:1.5px solid var(--linea);font:600 13px "Archivo";padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--tinta)}
  .lang:hover{border-color:var(--azul)}

  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center;padding:36px 0 64px}
  .tag{display:inline-block;background:#FDECEC;color:var(--rojo);font-weight:600;font-size:14px;padding:5px 12px;border-radius:6px}
  h1{font:800 clamp(38px,6vw,62px)/1.05 "Archivo";margin:16px 0;letter-spacing:-1px}
  .hero p{font-size:18px;color:var(--gris);max-width:44ch;margin:0 0 24px}
  .cta{display:inline-block;background:var(--azul);color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:8px}
  .cta:hover{background:#082E6E}
  .sub{display:block;margin-top:12px;font-size:14px;color:var(--gris)}

  .ticket{border:1.5px solid var(--linea);border-radius:12px;background:#fff;box-shadow:0 20px 40px rgba(11,61,145,.10);overflow:hidden}
  .ticket header{background:var(--azul2);padding:14px 20px;display:flex;justify-content:space-between;font:500 13px "IBM Plex Mono",monospace;color:var(--azul)}
  .ticket .body{padding:20px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--linea);font-size:15px}
  .row span:first-child{color:var(--gris)}
  .row.total{border:0;font-weight:800;font-size:18px;padding-top:14px}
  .ok{margin-top:12px;display:flex;align-items:center;gap:8px;font-size:14px;color:#1C7C3A;font-weight:600}

  section{padding:64px 0}
  .alt{background:#F6F8FC}
  h2{font:800 clamp(28px,4.5vw,40px)/1.1 "Archivo";margin:0 0 8px;letter-spacing:-.5px}
  .lead{color:var(--gris);margin:0 0 28px;max-width:60ch}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;list-style:none;padding:0;margin:0}
  .checks li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea)}
  .checks li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;margin-top:2px}
  .checks b{display:block}
  .checks small{color:var(--gris);font-size:14px}

  table.prices{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1.5px solid var(--linea)}
  .prices th,.prices td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--linea)}
  .prices th{font-size:13px;color:var(--gris);font-weight:600;background:#fff}
  .prices td:last-child{text-align:right;font-weight:800;color:var(--azul)}
  .fine{font-size:13px;color:var(--gris);margin-top:10px}

  .timeline{list-style:none;margin:0;padding:0;max-width:640px}
  .timeline li{position:relative;padding:0 0 28px 44px}
  .timeline li::before{content:attr(data-n);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--rojo);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
  .timeline li::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--linea)}
  .timeline li:last-child::after{display:none}
  .timeline b{display:block;font-size:18px}
  .timeline span{color:var(--gris)}
  footer{border-top:1px solid var(--linea);padding:28px 0;font-size:14px;color:var(--gris)}
  footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
  footer a{color:var(--azul)}
  @media (max-width:760px){.hero,.checks{grid-template-columns:1fr}.util .hide{display:none}}
</style>
</head>
<body>
<div class="demo" data-es="Proyecto de ejemplo: negocio ficticio. Diseño de <a href='mailto:dakrastudio@gmail.com'>Dakra Studio</a>" data-en="Sample project: fictional business. Design by <a href='mailto:dakrastudio@gmail.com'>Dakra Studio</a>"></div>
<div class="util"><div class="wrap"><span class="hide" data-es="Lun–Vie 8–6 · Sáb 8–1 · Pulaski, TN" data-en="Mon–Fri 8–6 · Sat 8–1 · Pulaski, TN"></span><a href="tel:+19315550147">☎ (931) 555-0147</a></div></div>
<div class="wrap">
  <nav><a class="logo" href="#"><span class="mark">R</span>Ramírez Auto & Diesel</a><button class="lang" data-lang>English</button></nav>

  <header class="hero">
    <div>
      <span class="tag" data-es="Hablamos español · We speak English" data-en="We speak English · Hablamos español"></span>
      <h1 data-es="Sabes el precio antes de que empecemos" data-en="Know the price before we start"></h1>
      <p data-es="Mecánica general y diésel en Pulaski. Revisamos tu carro, te mandamos la cotización por mensaje y solo trabajamos cuando tú dices que sí." data-en="General and diesel repair in Pulaski. We inspect your vehicle, text you a quote and only start once you say yes."></p>
      <a class="cta" href="sms:+19315550147" data-es="Pedir cotización por mensaje" data-en="Text us for a quote"></a>
      <span class="sub" data-es="Respondemos el mismo día." data-en="We reply the same day."></span>
    </div>
    <div class="ticket" aria-label="Ejemplo de cotización">
      <header><span data-es="COTIZACIÓN #1042" data-en="QUOTE #1042"></span><span>2017 F-150</span></header>
      <div class="body">
        <div class="row"><span data-es="Diagnóstico" data-en="Diagnostics"></span><span data-es="Balatas delanteras gastadas" data-en="Worn front pads"></span></div>
        <div class="row"><span data-es="Piezas" data-en="Parts"></span><span>$86</span></div>
        <div class="row"><span data-es="Mano de obra" data-en="Labor"></span><span>$90</span></div>
        <div class="row total"><span>Total</span><span>$176</span></div>
        <div class="ok" data-es="✔ Aprobado por el cliente por mensaje" data-en="✔ Approved by customer via text"></div>
      </div>
    </div>
  </header>
</div>

<main>
<section class="alt">
  <div class="wrap">
    <h2 data-es="Lo que reparamos" data-en="What we fix"></h2>
    <p class="lead" data-es="Carros, camionetas y trocas diésel, nacionales e importados." data-en="Cars, SUVs and diesel trucks, domestic and import."></p>
    <ul class="checks">
      <li><div><b data-es="Diagnóstico por computadora" data-en="Computer diagnostics"></b><small data-es="Luz de check engine y fallas eléctricas" data-en="Check engine light and electrical issues"></small></div></li>
      <li><div><b data-es="Frenos" data-en="Brakes"></b><small data-es="Balatas, discos y ABS" data-en="Pads, rotors and ABS"></small></div></li>
      <li><div><b data-es="Motor y diésel" data-en="Engine & diesel"></b><small data-es="Inyectores, turbos y fugas" data-en="Injectors, turbos and leaks"></small></div></li>
      <li><div><b data-es="Suspensión y dirección" data-en="Suspension & steering"></b><small data-es="Amortiguadores, rótulas y terminales" data-en="Shocks, ball joints and tie rods"></small></div></li>
      <li><div><b data-es="Aceite y fluidos" data-en="Oil & fluids"></b><small data-es="Aceite, transmisión y anticongelante" data-en="Oil, transmission and coolant"></small></div></li>
      <li><div><b data-es="Aire acondicionado" data-en="A/C"></b><small data-es="Recarga y detección de fugas" data-en="Recharge and leak detection"></small></div></li>
    </ul>
  </div>
</section>

<section>
  <div class="wrap">
    <h2 data-es="Precios de referencia" data-en="Reference prices"></h2>
    <p class="lead" data-es="Para que tengas una idea antes de llamar." data-en="So you have an idea before you call."></p>
    <table class="prices">
      <tr><th data-es="Servicio" data-en="Service"></th><th style="text-align:right" data-es="Desde" data-en="From"></th></tr>
      <tr><td data-es="Cambio de aceite sintético" data-en="Synthetic oil change"></td><td>$59</td></tr>
      <tr><td data-es="Escaneo de check engine" data-en="Check engine scan"></td><td>$40</td></tr>
      <tr><td data-es="Balatas delanteras" data-en="Front brake pads"></td><td>$150</td></tr>
      <tr><td data-es="Recarga de aire acondicionado" data-en="A/C recharge"></td><td>$120</td></tr>
    </table>
    <p class="fine" data-es="El precio final depende del vehículo. Siempre te cotizamos antes de trabajar." data-en="Final price depends on the vehicle. We always quote before working."></p>
  </div>
</section>

<section class="alt">
  <div class="wrap">
    <h2 data-es="Cómo funciona" data-en="How it works"></h2>
    <p class="lead" data-es="Sin sorpresas en la factura." data-en="No surprises on the bill."></p>
    <ol class="timeline">
      <li data-n="1"><b data-es="Nos mandas un mensaje" data-en="You text us"></b><span data-es="Año, modelo y qué está fallando." data-en="Year, model and what's going on."></span></li>
      <li data-n="2"><b data-es="Revisamos y cotizamos" data-en="We inspect and quote"></b><span data-es="Te mandamos el precio por mensaje, como el ejemplo de arriba." data-en="We text you the price, like the example above."></span></li>
      <li data-n="3"><b data-es="Tú apruebas" data-en="You approve"></b><span data-es="No tocamos nada sin tu permiso." data-en="We don't touch anything without your OK."></span></li>
      <li data-n="4"><b data-es="Lo recoges listo" data-en="Pick it up"></b><span data-es="Con garantía de 90 días en mano de obra." data-en="With a 90-day labor warranty."></span></li>
    </ol>
  </div>
</section>
</main>

<footer><div class="wrap"><span>© Ramírez Auto & Diesel · Pulaski, TN</span><span data-es="Página hecha por <a href='mailto:dakrastudio@gmail.com'>Dakra Studio</a>" data-en="Website by <a href='mailto:dakrastudio@gmail.com'>Dakra Studio</a>"></span></div></footer>

<script>
  let lang="es";
  function render(){
    document.documentElement.lang=lang;
    document.querySelectorAll("[data-es]").forEach(el=>el.innerHTML=el.dataset[lang]);
    document.querySelectorAll("[data-lang]").forEach(b=>b.textContent=lang==="es"?"English":"Español");
  }
  document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{lang=lang==="es"?"en":"es";render();}));
  render();
</script>
</body>
</html>
